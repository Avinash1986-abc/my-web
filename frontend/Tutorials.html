<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial Center — Rural Learning</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <!-- LOAD API ENGINE FIRST -->
  <script src="api.js"></script>
  <style>
    :root { 
        --primary: #10b981; 
        --primary-lt: #f0fdf4;
        --text: #1e293b; 
        --muted: #64748b;
        --bg: #f8fafc; 
        --border: #f1f5f9; 
        --red: #ef4444;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; opacity: 0; transition: opacity 0.4s; }
    
    /* --- PROFESSIONAL SIDEBAR --- */
    .sidebar { 
        width: 280px; 
        background: #fff; 
        border-right: 1px solid var(--border); 
        padding: 2rem 1.5rem; 
        display: flex;
        flex-direction: column;
        position: sticky; 
        top: 0; 
        height: 100vh; 
    }

    .logo { 
        font-size: 1.6rem; 
        font-weight: 800; 
        color: #1e293b; 
        margin-bottom: 2.5rem; 
        text-decoration: none; 
        display: block; 
    }
    .logo span { color: var(--primary); }

    .nav-section-label {
        font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
        color: #94a3b8; letter-spacing: 0.05em; margin: 1.5rem 0 0.8rem 0.8rem;
    }

    .nav-link { 
        display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
        text-decoration: none; color: var(--muted); border-radius: 12px; 
        font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; transition: 0.2s;
    }
    .nav-link:hover { background: var(--bg); color: var(--text); }
    .nav-link.on { background: var(--primary-lt); color: var(--primary); }
    .nav-link i { font-style: normal; font-size: 1.2rem; }
    .sign-out { margin-top: auto; color: var(--red) !important; }

    /* --- MAIN CONTENT --- */
    .main-content { flex: 1; padding: 40px 60px; max-width: 1200px; }

    /* Search Bar */
    .search-wrapper { display: flex; max-width: 700px; margin: 0 auto 50px; gap: 10px; }
    .search-input { flex: 1; padding: 15px 25px; border-radius: 50px; border: 1.5px solid var(--border); outline: none; font-size: 1rem; transition: 0.3s; }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.05); }
    .btn-search { background: var(--primary); color: white; border: none; padding: 0 30px; border-radius: 50px; font-weight: 700; cursor: pointer; }

    /* Video Cards */
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
    .v-card { background: #fff; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); transition: 0.3s; cursor: pointer; }
    .v-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
    .v-thumb { aspect-ratio: 16/9; background: #0f172a; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: #fff; }
    .v-body { padding: 20px; }
    .v-sub { font-size: 0.65rem; font-weight: 800; color: var(--primary); text-transform: uppercase; display: block; margin-bottom: 5px; }
    .v-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }
    .v-teacher { font-size: 0.8rem; color: var(--muted); }

    /* Teacher Studio */
    .studio-box { background: #fff; padding: 30px; border-radius: 24px; border: 1px solid var(--border); margin-bottom: 40px; }
    input[type="text"], input[type="file"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; font-family: inherit; }
    .btn-pub { width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; }
    
    .v-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); }
    .v-table th { text-align: left; padding: 15px 20px; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
    .v-table td { padding: 15px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    
    #teacher-view, #student-view { display: none; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <a href="#" class="logo">Rural<span>Learning</span></a>
    <nav id="side-nav" style="display: contents;"></nav>
  </aside>

  <main class="main-content">
    <!-- STUDENT VIEW -->
    <div id="student-view">
        <h1 style="font-family:'Playfair Display'; font-size:2.4rem; margin-bottom:30px;">Explore Lessons</h1>
        <div class="search-wrapper">
            <input type="text" id="v-search" class="search-input" placeholder="What do you want to learn today?">
            <button class="btn-search" id="btn-search">Search</button>
        </div>
        <div class="video-grid" id="student-grid"></div>
    </div>

    <!-- TEACHER VIEW -->
    <div id="teacher-view">
        <h1 style="font-family:'Playfair Display'; font-size:2.4rem; margin-bottom:10px;">Video Studio</h1>
        <div class="studio-box">
            <h3 style="margin-bottom: 20px;">Publish New Lecture</h3>
            <form id="upload-form" style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div>
                    <input type="text" id="v-title" placeholder="Lecture Title" required>
                    <input type="text" id="v-subject" placeholder="Subject (e.g. Science)" required>
                    <input type="text" id="v-class" placeholder="Target Class (e.g. 10th)" required>
                </div>
                <div style="border: 2px dashed var(--border); border-radius: 15px; padding: 20px; text-align: center;">
                    <input type="file" id="file-input" accept="video/mp4" required>
                    <button type="submit" class="btn-pub" id="pub-btn">🚀 PUBLISH VIDEO</button>
                </div>
            </form>
        </div>
        <h3 style="margin-bottom:15px;">My Uploaded Lectures</h3>
        <table class="v-table">
            <thead><tr><th>Title</th><th>Subject</th><th>Class</th><th>Action</th></tr></thead>
            <tbody id="teacher-rows"></tbody>
        </table>
    </div>
  </main>

<script>
    let allVideos = [];

    document.addEventListener('DOMContentLoaded', async () => {
        const user = getUser();
        if (!user) return window.location.replace('login.html');

        // BUILD DYNAMIC SIDEBAR
        const nav = document.getElementById('side-nav');
        if (user.role === 'teacher') {
            nav.innerHTML = `
                <a href="Dashboard-teacher.html" class="nav-link"><i>🏠</i> Studio Home</a>
                <a href="Tutorials.html" class="nav-link on"><i>🎥</i> Video Studio</a>
                <a href="Assignments.html" class="nav-link"><i>📝</i> Manage Work</a>
                <a href="Quiz.html" class="nav-link"><i>⏱️</i> Quiz Creator</a>
                <a href="Materials.html" class="nav-link"><i>📄</i>  Study Library</a>
                <div class="nav-section-label">Account Settings</div>
                <a href="student-profile.html" class="nav-link"><i>👤</i> My Profile</a>
                <a href="#" onclick="clearSession()" class="nav-link sign-out"><i>🚪</i> Sign Out</a>
            `;
            document.getElementById('teacher-view').style.display = 'block';
            loadTeacherVideos();
        } else {
            nav.innerHTML = `
                <a href="Dashboard-student.html" class="nav-link"><i>🏠</i> Dashboard</a>
                <a href="Tutorials.html" class="nav-link on"><i>🎥</i> Video Classes</a>
                <a href="Assignments-student.html" class="nav-link"><i>📝</i> Assignments</a>
                <a href="Quiz.html" class="nav-link"><i>⏱️</i> Quizzes</a>
                <a href="Materials.html" class="nav-link"><i>📄</i>  Study Library</a>
                <div class="nav-section-label">Account Settings</div>
                <a href="student-profile.html" class="nav-link"><i>👤</i> My Profile</a>
                <a href="#" onclick="clearSession()" class="nav-link sign-out"><i>🚪</i> Sign Out</a>
            `;
            document.getElementById('student-view').style.display = 'block';
            loadStudentLibrary();
        }

        document.getElementById('btn-search').onclick = performSearch;
        document.getElementById('v-search').oninput = performSearch;
        document.body.style.opacity = '1';
    });

    // ── SEARCH LOGIC ──
    function performSearch() {
        const q = document.getElementById('v-search').value.toLowerCase();
        const filtered = allVideos.filter(v => 
            v.title?.toLowerCase().includes(q) || v.subject?.toLowerCase().includes(q)
        );
        renderGrid(filtered);
    }

    // ── STUDENT: LOAD VIDEOS ──
    async function loadStudentLibrary() {
        const res = await ContentAPI.getVideos();
        allVideos = Array.isArray(res) ? res : (res.videos || []);
        renderGrid(allVideos);
    }

    function renderGrid(list) {
        const container = document.getElementById('student-grid');
        if (!list || list.length === 0) {
            container.innerHTML = '<div style="padding:40px; color:#64748b;">No lessons found matching your search.</div>';
            return;
        }

        container.innerHTML = list.map(v => {
            const rawUrl = v.videoUrl || '';
            const fullUrl = rawUrl.startsWith('http') ? rawUrl : ROOT_URL + rawUrl;
            
            return `
                <div class="v-card" onclick="playVideo('${encodeURIComponent(fullUrl)}', '${encodeURIComponent(v.title)}')">
                    <div class="v-thumb">🎥</div>
                    <div class="v-body">
                        <span class="v-sub">${v.subject || 'General'}</span>
                        <h4 class="v-title">${v.title || 'Untitled Lecture'}</h4>
                        <p class="v-teacher">By ${v.teacherName || 'Faculty Member'}</p>
                    </div>
                </div>
            `;
        }).join('');
    }

    function playVideo(url, title) {
        window.location.href = `watch.html?url=${url}&title=${title}`;
    }

    // ── TEACHER: LOAD VIDEOS ──
    async function loadTeacherVideos() {
        const res = await ContentAPI.getVideos();
        const videos = Array.isArray(res) ? res : (res.videos || []);
        const tbody = document.getElementById('teacher-rows');
        
        tbody.innerHTML = videos.map(v => `
            <tr>
                <td><b>${v.title}</b></td>
                <td>${v.subject}</td>
                <td>${v.targetClass || 'N/A'}</td>
                <td><button onclick="deleteVideo(${v.id})" style="color:var(--red); background:none; border:none; cursor:pointer; font-weight:700;">Delete</button></td>
            </tr>
        `).join('');
    }

    document.getElementById('upload-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('pub-btn');
        const formData = new FormData();
        formData.append('video', document.getElementById('file-input').files[0]);
        formData.append('title', document.getElementById('v-title').value);
        formData.append('subject', document.getElementById('v-subject').value);
        formData.append('targetClass', document.getElementById('v-class').value);

        btn.innerText = "⏳ Uploading to Studio...";
        btn.disabled = true;

        const res = await ContentAPI.uploadVideo(formData);
        if (res.success) {
            alert("✅ Video published successfully!");
            location.reload();
        } else {
            alert("❌ Upload failed: " + res.message);
            btn.innerText = "🚀 PUBLISH VIDEO";
            btn.disabled = false;
        }
    };

    async function deleteVideo(id) {
        if(confirm("Permanently delete this lecture?")) {
            const res = await ContentAPI.deleteVideo(id);
            if(res.success) loadTeacherVideos();
        }
    }
</script>
</body>
</html>
