<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial Center — Rural Learning</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <script src="api.js"></script>
  <script src="main.js"></script>
  <style>
    :root {
      --primary: #52b788;
      --primary-soft: rgba(82, 183, 136, 0.1);
      --bg: #081c15;
      --card: rgba(255, 255, 255, 0.04);
      --sidebar: #0b251d;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --border: rgba(82, 183, 136, 0.15);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      --accent: #f4a261;
      --red: #ef4444;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: var(--bg); 
      color: var(--text); 
      display: flex; 
      min-height: 100vh; 
      opacity: 0; 
      transition: opacity 0.5s ease; 
    }

    /* background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(circle at 80% 20%, rgba(82, 183, 136, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 10% 80%, rgba(244, 162, 97, 0.03) 0%, transparent 40%);
      pointer-events: none;
    }
    
    /* --- SIDEBAR --- */
    .sidebar { 
        width: 280px; 
        background: var(--sidebar); 
        border-right: 1px solid var(--border); 
        padding: 40px 24px; 
        display: flex;
        flex-direction: column;
        position: sticky; 
        top: 0; 
        height: 100vh; 
        flex-shrink: 0;
    }

    .logo { 
        font-family: 'Playfair Display'; 
        font-size: 1.5rem; 
        font-weight: 900; 
        text-decoration: none; 
        color: var(--text); 
        display: block; 
        margin-bottom: 48px; 
    }
    .logo span { color: var(--primary); }

    .nav-menu { list-style: none; flex-grow: 1; }
    .nav-link { 
        display: flex; 
        align-items: center; 
        gap: 12px; 
        padding: 14px 16px; 
        text-decoration: none; 
        color: var(--text-muted); 
        border-radius: 14px; 
        font-weight: 600; 
        transition: 0.3s; 
        margin-bottom: 5px; 
    }
    .nav-link:hover, .nav-link.active { 
        background: var(--primary-soft); 
        color: var(--primary); 
        box-shadow: 0 4px 20px rgba(82, 183, 136, 0.08);
    }

    .profile-footer {
      background: var(--card); 
      border: 1px solid var(--border);
      padding: 12px; 
      border-radius: 16px; 
      display: flex; 
      align-items: center; 
      gap: 12px;
      margin-top: auto;
    }
    .profile-avatar { 
      width: 36px; 
      height: 36px; 
      background: var(--primary); 
      color: #081c15; 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 800; 
      font-size: 0.9rem; 
    }

    /* --- MAIN CONTENT --- */
    .main-content { 
      flex: 1; 
      padding: 40px 60px; 
      max-width: 1100px; 
      margin: 0 auto; 
      width: 100%;
      animation: fadeInUp 0.8s ease;
    }

    /* Search Bar */
    .search-wrapper { display: flex; max-width: 650px; margin: 0 auto 40px; gap: 12px; }
    .search-input { 
      flex: 1; 
      padding: 14px 24px; 
      border-radius: 50px; 
      border: 1.5px solid var(--border); 
      outline: none; 
      font-size: 1rem; 
      transition: 0.3s; 
      background: var(--card);
      color: var(--text);
    }
    .search-input:focus { 
      border-color: var(--primary); 
      background: rgba(82, 183, 136, 0.05); 
    }
    .search-input::placeholder { color: rgba(255, 255, 255, 0.3); }

    .btn-search { 
      background: var(--primary); 
      color: #081c15; 
      border: none; 
      padding: 0 32px; 
      border-radius: 50px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(82, 183, 136, 0.2);
    }
    .btn-search:hover {
      background: #409a71;
      transform: translateY(-2px);
    }

    /* Video Cards */
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .v-card { 
      background: var(--card); 
      border-radius: 24px; 
      overflow: hidden; 
      border: 1px solid var(--border); 
      transition: 0.3s; 
      cursor: pointer; 
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .v-card:hover { 
      transform: translateY(-5px); 
      border-color: var(--primary); 
      box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
    }
    .v-thumb { 
      aspect-ratio: 16/9; 
      background: #0b251d; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 3rem; 
      color: var(--primary); 
      border-bottom: 1px solid var(--border);
    }
    .v-body { padding: 20px; }
    .v-sub { 
      font-size: 0.7rem; 
      font-weight: 800; 
      color: var(--accent); 
      text-transform: uppercase; 
      display: block; 
      margin-bottom: 6px; 
      letter-spacing: 0.5px;
    }
    .v-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; color: var(--text); line-height: 1.4; }
    .v-teacher { font-size: 0.8rem; color: var(--text-muted); }

    /* Teacher Studio Form */
    .studio-box { 
      background: var(--card); 
      padding: 32px; 
      border-radius: 24px; 
      border: 1px solid var(--border); 
      margin-bottom: 40px; 
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    input[type="text"], input[type="file"] { 
      width: 100%; 
      padding: 12px 16px; 
      border-radius: 12px; 
      border: 1px solid var(--border); 
      margin-bottom: 16px; 
      font-family: inherit; 
      background: rgba(255,255,255,0.02);
      color: var(--text);
      outline: none;
      transition: 0.3s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
      background: rgba(82, 183, 136, 0.05);
    }
    .btn-pub { 
      width: 100%; 
      padding: 16px; 
      background: var(--primary); 
      color: #081c15; 
      border: none; 
      border-radius: 12px; 
      font-weight: 800; 
      cursor: pointer; 
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(82, 183, 136, 0.2);
    }
    .btn-pub:hover {
      background: #409a71;
      transform: translateY(-2px);
    }
    
    .v-table { 
      width: 100%; 
      border-collapse: collapse; 
      background: var(--card); 
      border-radius: 24px; 
      overflow: hidden; 
      border: 1px solid var(--border); 
      box-shadow: var(--shadow);
    }
    .v-table th { text-align: left; padding: 18px 24px; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
    .v-table td { padding: 18px 24px; border-bottom: 1px solid var(--border); font-size: 0.9rem; color: var(--text); }
    .v-table tr:last-child td { border-bottom: none; }
    
    #teacher-view, #student-view { display: none; }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <a href="#" class="logo">Rural<span>Learning</span></a>
    <ul class="nav-menu" id="side-nav">
      <!-- Injected Dynamically Based on Role -->
    </ul>
    <div class="profile-footer">
        <div class="profile-avatar" id="footer-init">?</div>
        <div>
            <div id="footer-name" style="font-weight:700; font-size:0.85rem; color: var(--text);">Loading...</div>
            <div id="footer-class" style="font-size:0.7rem; color:var(--text-muted);">fetching profile</div>
        </div>
    </div>
  </aside>

  <main class="main-content">
    <!-- STUDENT VIEW -->
    <div id="student-view">
        <h1 style="font-family:'Playfair Display'; font-size:2.4rem; margin-bottom:30px;">Explore Lessons</h1>
        <div class="search-wrapper">
            <input type="text" id="v-search" class="search-input" placeholder="What do you want to learn today?">
            <button class="btn-search" id="btn-search">Search</button>
        </div>
        <div class="video-grid" id="student-grid"></div>
    </div>

    <!-- TEACHER VIEW -->
    <div id="teacher-view">
        <h1 style="font-family:'Playfair Display'; font-size:2.4rem; margin-bottom:10px;">Video Studio</h1>
        <div class="studio-box">
            <h3 style="font-family:'Playfair Display'; font-size:1.3rem; margin-bottom: 20px;">Publish New Lecture</h3>
            <form id="upload-form" style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div>
                    <input type="text" id="v-title" placeholder="Lecture Title" required>
                    <input type="text" id="v-subject" placeholder="Subject (e.g. Science)" required>
                    <input type="text" id="v-class" placeholder="Target Class (e.g. 10th)" required>
                </div>
                <div style="border: 2px dashed var(--border); border-radius: 15px; padding: 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 15px;">
                    <input type="file" id="file-input" accept="video/mp4" required>
                    <button type="submit" class="btn-pub" id="pub-btn">🚀 PUBLISH VIDEO</button>
                </div>
            </form>
        </div>
        <h3 style="font-family:'Playfair Display'; font-size:1.4rem; margin-bottom:15px;">My Uploaded Lectures</h3>
        <table class="v-table">
            <thead><tr><th>Title</th><th>Subject</th><th>Class</th><th>Action</th></tr></thead>
            <tbody id="teacher-rows"></tbody>
        </table>
    </div>
  </main>

<script>
    let allVideos = [];

    document.addEventListener('DOMContentLoaded', async () => {
        const user = getUser();
        if (!user) return window.location.replace('Login.html');

        // Setup profile UI
        document.getElementById('footer-name').innerText = user.name;
        document.getElementById('footer-class').innerText = user.studentClass ? ("CLASS " + user.studentClass.toUpperCase()) : "Faculty Member";
        document.getElementById('footer-init').innerText = user.name.charAt(0).toUpperCase();

        // BUILD DYNAMIC SIDEBAR
        const nav = document.getElementById('side-nav');
        if (user.role === 'teacher') {
            nav.innerHTML = `
                <a href="Dashboard-teacher.html" class="nav-link">📊 Dashboard</a>
                <a href="Upload-video.html" class="nav-link active">🎥 Video Lectures</a>
                <a href="Assignments.html" class="nav-link">✏️ Student Tasks</a>
                <a href="Quiz.html" class="nav-link">⏱️ Quiz Creator</a>
                <a href="Materials.html" class="nav-link">📄 Study Notes</a>
                <a href="Chat.html" class="nav-link">💬 Classroom Chat</a>
                <div style="margin: 40px 0 10px; font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Personal Analytics</div>
                <a href="Teacher-profile.html" class="nav-link">👤 My Profile</a>
                <a href="#" onclick="logout()" class="nav-link" style="color: #ef4444; margin-top: 40px;">🚪 Sign Out</a>
            `;
            document.getElementById('teacher-view').style.display = 'block';
            loadTeacherVideos();
        } else {
            nav.innerHTML = `
                <a href="Dashboard-student.html" class="nav-link">🏠 Dashboard</a>
                <a href="Tutorials.html" class="nav-link active">🎥 Video Lessons</a>
                <a href="Assignments-student.html" class="nav-link">✏️ Assignments</a>
                <a href="Quiz.html" class="nav-link">⏱️ Quizzes</a>
                <a href="Materials.html" class="nav-link">📄 Study Library</a>
                <a href="Chat.html" class="nav-link">💬 Classroom Chat</a>
                <div style="margin: 40px 0 10px; font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Personal Analytics</div>
                <a href="student-profile.html" class="nav-link">👤 My Profile</a>
                <a href="Progress.html" class="nav-link">📊 My Reports</a>
                <a href="Scoreboard.html" class="nav-link">🏆 Honor Board</a>
                <a href="#" onclick="logout()" class="nav-link" style="color: #ef4444; margin-top: 40px;">🚪 Sign Out</a>
            `;
            document.getElementById('student-view').style.display = 'block';
            loadStudentLibrary();
        }

        document.getElementById('btn-search').onclick = performSearch;
        document.getElementById('v-search').oninput = performSearch;
        document.body.style.opacity = '1';
    });

    function performSearch() {
        const q = document.getElementById('v-search').value.toLowerCase();
        const filtered = allVideos.filter(v => 
            v.title?.toLowerCase().includes(q) || v.subject?.toLowerCase().includes(q)
        );
        renderGrid(filtered);
    }

    async function loadStudentLibrary() {
        const res = await ContentAPI.getVideos();
        allVideos = Array.isArray(res) ? res : (res.videos || []);
        renderGrid(allVideos);
    }

    function renderGrid(list) {
        const container = document.getElementById('student-grid');
        if (!list || list.length === 0) {
            container.innerHTML = '<div style="padding:40px; color:var(--text-muted);">No lessons found matching your search.</div>';
            return;
        }

        container.innerHTML = list.map(v => {
            const rawUrl = v.videoUrl || '';
            const fullUrl = rawUrl.startsWith('http') ? rawUrl : ROOT_URL + rawUrl;
            
            return `
                <div class="v-card" onclick="playVideo('${encodeURIComponent(fullUrl)}', '${encodeURIComponent(v.title)}')">
                    <div class="v-thumb">🎥</div>
                    <div class="v-body">
                        <span class="v-sub">${v.subject || 'General'}</span>
                        <h4 class="v-title">${v.title || 'Untitled Lecture'}</h4>
                        <p class="v-teacher">By ${v.teacherName || 'Faculty Member'}</p>
                    </div>
                </div>
            `;
        }).join('');
    }

    function playVideo(url, title) {
        window.location.href = `watch.html?url=${url}&title=${title}`;
    }

    async function loadTeacherVideos() {
        const res = await ContentAPI.getVideos();
        const videos = Array.isArray(res) ? res : (res.videos || []);
        const tbody = document.getElementById('teacher-rows');
        
        tbody.innerHTML = videos.map(v => `
            <tr>
                <td><b>${v.title}</b></td>
                <td>${v.subject}</td>
                <td>${v.targetClass || 'N/A'}</td>
                <td><button onclick="deleteVideo(${v.id})" style="color:var(--red); background:none; border:none; cursor:pointer; font-weight:700;">Delete</button></td>
            </tr>
        `).join('');
    }

    document.getElementById('upload-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('pub-btn');
        const fileInput = document.getElementById('file-input');
        
        if (!fileInput.files[0]) {
            alert("❌ Error: No file selected!");
            return;
        }

        const formData = new FormData();
        formData.append('video', fileInput.files[0]);
        formData.append('title', document.getElementById('v-title').value);
        formData.append('subject', document.getElementById('v-subject').value);
        formData.append('targetClass', document.getElementById('v-class').value);

        try {
            btn.innerText = "⏳ Uploading...";
            btn.disabled = true;

            const res = await ContentAPI.uploadVideo(formData, (prog) => {
                btn.innerText = `⏳ ${prog}%`;
            });

            if (res.success) {
                alert("✅ SUCCESS: Lecture published!");
                location.reload();
            } else {
                alert("❌ BACKEND ERROR: " + res.message);
            }
        } catch (err) {
            console.error("❌ CRASH DURING UPLOAD:", err);
            alert("❌ CRITICAL ERROR: Check Browser Console!");
        } finally {
            btn.innerText = "🚀 PUBLISH VIDEO";
            btn.disabled = false;
        }
    };

    async function deleteVideo(id) {
        if(confirm("Permanently delete this lecture?")) {
            const res = await ContentAPI.deleteVideo(id);
            if(res.success) loadTeacherVideos();
        }
    }

    function logout() {
        sessionStorage.clear();
        window.location.replace('Login.html');
    }
</script>
</body>
</html>
