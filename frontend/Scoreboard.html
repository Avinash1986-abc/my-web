<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard — Rural Learning Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  
  <script src="api.js"></script>
  <script src="main.js"></script>

  <style>
    :root {
      --primary: #52b788;
      --primary-soft: rgba(82, 183, 136, 0.1);
      --bg: #081c15;
      --card: rgba(255, 255, 255, 0.04);
      --sidebar: #0b251d;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --border: rgba(82, 183, 136, 0.15);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      --accent: #f4a261;
      
      /* Medal Colors */
      --gold: #fbbf24;
      --silver: #94a3b8;
      --bronze: #b45309;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.5s ease;
      overflow-y: auto;
    }

    /* background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(circle at 80% 20%, rgba(82, 183, 136, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 10% 80%, rgba(244, 162, 97, 0.03) 0%, transparent 40%);
      pointer-events: none;
    }

    .layout-wrapper { display: flex; min-height: 100vh; }

    /* --- SIDEBAR --- */
    .sidebar {
      width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 40px 24px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .logo { 
      font-family: 'Playfair Display'; 
      font-size: 1.5rem; 
      font-weight: 900; 
      text-decoration: none; 
      color: var(--text); 
      display: block; 
      margin-bottom: 48px; 
    }
    .logo span { color: var(--primary); }

    .nav-menu { list-style: none; flex-grow: 1; }
    .nav-link { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 14px 16px; 
      text-decoration: none; 
      color: var(--text-muted); 
      border-radius: 14px; 
      font-weight: 600; 
      transition: 0.3s; 
      margin-bottom: 5px; 
    }
    .nav-link:hover, .nav-link.active { 
      background: var(--primary-soft); 
      color: var(--primary); 
      box-shadow: 0 4px 20px rgba(82, 183, 136, 0.08);
    }

    .profile-footer {
      background: var(--card); 
      border: 1px solid var(--border);
      padding: 12px; 
      border-radius: 16px; 
      display: flex; 
      align-items: center; 
      gap: 12px;
      margin-top: auto;
    }
    .profile-avatar { 
      width: 36px; 
      height: 36px; 
      background: var(--primary); 
      color: #081c15; 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 800; 
      font-size: 0.9rem; 
    }

    /* --- MAIN CONTENT AREA --- */
    .main-content { 
      flex: 1; 
      padding: 40px 60px; 
      max-width: 1000px; 
      margin: 0 auto; 
      width: 100%; 
      animation: fadeInUp 0.8s ease;
    }

    .header { margin-bottom: 40px; text-align: center; }
    .header h1 { font-family: 'Playfair Display'; font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; }
    .header p { color: var(--text-muted); font-size: 1.1rem; }

    .timer-badge {
      display: inline-block;
      background: var(--primary-soft);
      border: 1px solid var(--border);
      color: var(--primary);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-top: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* --- PODIUM DESIGN --- */
    .podium-container {
      display: grid;
      grid-template-columns: 1fr 1.1fr 1fr;
      gap: 20px;
      align-items: end;
      margin-bottom: 48px;
    }

    .podium-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 16px;
      text-align: center;
      box-shadow: var(--shadow);
      transition: 0.3s;
      backdrop-filter: blur(10px);
      position: relative;
    }
    .podium-card:hover { transform: translateY(-4px); border-color: var(--primary); }

    .podium-card.rank-1 {
      padding: 48px 24px;
      border-color: var(--gold);
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.08);
      background: rgba(251, 191, 36, 0.02);
    }
    .podium-card.rank-2 {
      border-color: var(--silver);
      box-shadow: 0 0 30px rgba(148, 163, 184, 0.05);
    }
    .podium-card.rank-3 {
      border-color: var(--bronze);
      box-shadow: 0 0 30px rgba(180, 83, 9, 0.05);
    }

    .medal { font-size: 2.5rem; margin-bottom: 12px; display: block; }
    .podium-avatar {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.05); border: 2px solid var(--border);
      margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
    }
    .rank-1 .podium-avatar { 
      border-color: var(--gold); 
      width: 75px; 
      height: 75px; 
      font-size: 1.8rem; 
      background: rgba(251, 191, 36, 0.1);
      color: var(--gold);
    }
    .rank-2 .podium-avatar { 
      border-color: var(--silver); 
      background: rgba(148, 163, 184, 0.1);
      color: var(--silver);
    }
    .rank-3 .podium-avatar { 
      border-color: var(--bronze); 
      background: rgba(180, 83, 9, 0.1);
      color: var(--accent);
    }

    .podium-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 6px; }
    .podium-score { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .podium-score span { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

    /* --- RANKING LIST --- */
    .rankings-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .rank-row {
      display: grid;
      grid-template-columns: 60px 50px 1fr 100px;
      align-items: center;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      transition: 0.2s;
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-row:hover {
      background: rgba(255, 255, 255, 0.01);
    }

    /* Highlight the User */
    .rank-row.is-user {
      background: rgba(82, 183, 136, 0.05);
      border-left: 4px solid var(--primary);
    }

    .r-num { font-weight: 800; color: var(--text-muted); }
    .r-avatar { 
      width: 35px; 
      height: 35px; 
      background: rgba(255, 255, 255, 0.05); 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 800; 
      font-size: 0.85rem; 
      color: var(--text);
    }
    .r-name { font-weight: 700; padding-left: 12px; }
    .r-score { text-align: right; font-weight: 900; color: var(--primary); font-size: 1.1rem; }

    .btn-action {
      display: block; 
      width: fit-content; 
      margin: 40px auto 0;
      background: var(--primary); 
      color: #081c15;
      padding: 16px 36px; 
      border-radius: 14px; 
      text-decoration: none;
      font-weight: 700; 
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(82, 183, 136, 0.2);
    }
    .btn-action:hover {
      background: #409a71;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(82, 183, 136, 0.3);
    }

    .empty-state { 
      text-align: center; 
      padding: 60px; 
      color: var(--text-muted); 
      border: 2px dashed var(--border); 
      border-radius: 24px; 
      background: var(--card);
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="layout-wrapper">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="#" class="logo">Rural<span>Learning</span></a>
    <ul class="nav-menu" id="dynamic-nav">
      <!-- Injected Dynamically Based on Role -->
    </ul>

    <div class="profile-footer">
        <div class="profile-avatar" id="footer-init">?</div>
        <div>
            <div id="footer-name" style="font-weight:700; font-size:0.85rem; color: var(--text);">Loading...</div>
            <div id="footer-class" style="font-size:0.7rem; color:var(--text-muted);">fetching profile</div>
        </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <h1>The Honor Board</h1>
      <p>Recognizing our top performing scholars of the week.</p>
      <div class="timer-badge">⏳ Leaderboard resets weekly</div>
    </header>

    <div id="scoreboard-render-zone">
        <!-- TOP 3 WINNERS GO HERE -->
        <section class="podium-container" id="podium-area"></section>

        <!-- REST OF THE LIST GOES HERE -->
        <section class="rankings-box" id="rankings-list"></section>
    </div>

    <a href="Quiz.html" class="btn-action" id="board-action-btn">Take a Quiz to Climb 🚀</a>
  </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Auth Guard
        const user = getUser(); 
        if (!user) {
            window.location.replace('Login.html');
            return;
        }

        // 2. Setup Profile UI
        document.getElementById('footer-name').innerText = user.name;
        document.getElementById('footer-class').innerText = user.studentClass ? ("CLASS " + user.studentClass.toUpperCase()) : "Faculty Member";
        document.getElementById('footer-init').innerText = user.name.charAt(0).toUpperCase();

        // Adjust Action Button for Teachers
        const actionBtn = document.getElementById('board-action-btn');
        if (user.role === 'teacher') {
            actionBtn.innerText = "Manage Quizzes 📝";
            actionBtn.href = "quiz.html";
        }

        // 3. Render Navigation Sidebar
        renderSidebar(user);

        // 4. Load Board Data from MySQL
        fetchBoardData(user.id);

        document.body.style.opacity = '1';
    });

    // Render navigation links dynamically
    function renderSidebar(user) {
        const nav = document.getElementById('dynamic-nav');
        if (!nav) return;

        if (user.role === 'teacher') {
            nav.innerHTML = `
                <a href="Dashboard-teacher.html" class="nav-link">📊 Dashboard</a>
                <a href="Upload-video.html" class="nav-link">🎥 Video Lectures</a>
                <a href="Assignments.html" class="nav-link">✏️ Student Tasks</a>
                <a href="Quiz.html" class="nav-link">⏱️ Quiz Creator</a>
                <a href="Materials.html" class="nav-link">📄 Study Notes</a>
                <a href="Chat.html" class="nav-link">💬 Classroom Chat</a>
                <div style="margin: 40px 0 10px; font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Personal Analytics</div>
                <a href="Teacher-profile.html" class="nav-link">👤 My Profile</a>
                <a href="#" onclick="logout()" class="nav-link" style="color: #ef4444; margin-top: 40px;">🚪 Sign Out</a>
            `;
        } else {
            nav.innerHTML = `
                <a href="Dashboard-student.html" class="nav-link">🏠 Dashboard</a>
                <a href="Tutorials.html" class="nav-link">🎥 Video Lessons</a>
                <a href="Assignments.html" class="nav-link">✏️ Assignments</a>
                <a href="Quiz.html" class="nav-link">⏱️ Quizzes</a>
                <a href="Materials.html" class="nav-link">📄 Study Library</a>
                <a href="Chat.html" class="nav-link">💬 Classroom Chat</a>
                <div style="margin: 40px 0 10px; font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Personal Analytics</div>
                <a href="student-profile.html" class="nav-link">👤 My Profile</a>
                <a href="#" onclick="logout()" class="nav-link" style="color: #ef4444; margin-top: 40px;">🚪 Sign Out</a>
            `;
        }
        
        // Mark scoreboard link as active
        const links = nav.querySelectorAll('.nav-link');
        links.forEach(l => {
            if (l.getAttribute('href') === 'Scoreboard.html' || (l.getAttribute('href') === 'Quiz.html' && window.location.pathname.includes('Quiz.html'))) {
                l.classList.add('active');
            }
        });
    }

    async function fetchBoardData(currentUserId) {
        const podiumArea = document.getElementById('podium-area');
        const rankingList = document.getElementById('rankings-list');

        let students = [];
        try {
            const response = await AcademicAPI.getScoreboard();
            students = response.success ? response.students : [];
        } catch (e) {
            console.error("Scoreboard fetch failed", e);
        }

        if (!students || students.length === 0) {
            document.getElementById('scoreboard-render-zone').innerHTML = `
                <div class="empty-state">
                    <h3>The board is empty.</h3>
                    <p style="font-size: 0.85rem; margin-top:8px;">No scores recorded this week. Be the first to take a quiz!</p>
                </div>`;
            return;
        }

        // Sort students by points descending
        students.sort((a, b) => b.points - a.points);

        // ── 1. RENDER PODIUM (Top 3) ──
        const top3 = students.slice(0, 3);
        const podiumLayout = [
            top3[1] ? { ...top3[1], rank: 2, medal: '🥈' } : null,
            top3[0] ? { ...top3[0], rank: 1, medal: '🥇' } : null,
            top3[2] ? { ...top3[2], rank: 3, medal: '🥉' } : null
        ];

        podiumArea.innerHTML = podiumLayout.map(s => s ? `
            <div class="podium-card rank-${s.rank}">
                <span class="medal">${s.medal}</span>
                <div class="podium-avatar">${s.name.charAt(0)}</div>
                <div class="podium-name">${s.name}</div>
                <div class="podium-score">${s.points} <span>pts</span></div>
            </div>
        ` : '<div></div>').join('');

        // ── 2. RENDER DETAILED LIST (All Students) ──
        rankingList.innerHTML = students.map((s, index) => {
            const isMe = s.id == currentUserId;
            return `
                <div class="rank-row ${isMe ? 'is-user' : ''}">
                    <span class="r-num">${index + 1}</span>
                    <div class="r-avatar" style="${isMe ? 'background:var(--primary); color:#081c15;' : ''}">${isMe ? 'YOU' : s.name.charAt(0)}</div>
                    <span class="r-name">${s.name}</span>
                    <span class="r-score">${s.points}</span>
                </div>
            `;
        }).join('');
    }

    function logout() {
        sessionStorage.clear();
        window.location.replace('Login.html');
    }
</script>

</body>
</html>
