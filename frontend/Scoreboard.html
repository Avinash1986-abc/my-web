<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard — Rural Learning Portal</title>
  <!-- Modern Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Link Master Scripts -->
  <script src="api.js"></script>
  <script src="main.js"></script>

  <style>
    :root {
      /* --- SENIOR WHITE THEME PALETTE --- */
      --bg-page: #ffffff;
      --bg-side: #f8fafc;
      --primary: #52b788;       /* Emerald Green */
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 20px rgba(0,0,0,0.05);
      
      /* Medal Colors */
      --gold: #fbbf24;
      --silver: #94a3b8;
      --bronze: #b45309;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-dark);
      min-height: 100vh;
      opacity: 0; /* Security Guard: Hidden until session verified */
      transition: opacity 0.4s ease;
    }

    .layout-wrapper { display: flex; min-height: 100vh; }

    /* --- SIDEBAR --- */
    .sidebar {
      width: 260px;
      background-color: var(--bg-side);
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .logo { 
      font-size: 1.4rem; font-weight: 800; color: var(--text-dark); 
      text-decoration: none; margin-bottom: 2.5rem; display: block;
    }
    .logo span { color: var(--primary); }

    .nav-menu { list-style: none; flex: 1; }
    .nav-menu li { margin-bottom: 5px; }
    .nav-menu a {
      text-decoration: none; color: var(--text-muted);
      padding: 12px 16px; display: flex; align-items: center;
      gap: 12px; border-radius: 12px; font-weight: 600; transition: 0.3s;
    }
    .nav-menu a:hover, .nav-menu a.active {
      background: white; color: var(--primary); box-shadow: var(--shadow);
    }

    /* --- MAIN CONTENT AREA --- */
    .main-content { flex: 1; padding: 3rem 4rem; overflow-y: auto; }

    .header { margin-bottom: 3rem; text-align: center; }
    .header h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .header p { color: var(--text-muted); }

    .timer-badge {
      display: inline-block;
      background: #f0fdf4;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-top: 1rem;
      text-transform: uppercase;
    }

    /* --- PODIUM DESIGN --- */
    .podium-container {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 20px;
      align-items: end;
      margin-bottom: 4rem;
    }

    .podium-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2rem 1rem;
      text-align: center;
      box-shadow: var(--shadow);
      transition: 0.3s;
    }
    .podium-card:hover { transform: translateY(-5px); border-color: var(--primary); }

    .podium-card.rank-1 {
      padding: 3.5rem 1.5rem;
      border-color: var(--gold);
      background: linear-gradient(180deg, #fffcf0 0%, #ffffff 100%);
    }

    .medal { font-size: 2.5rem; margin-bottom: 10px; display: block; }
    .podium-avatar {
      width: 60px; height: 60px; border-radius: 50%;
      background: var(--bg-side); border: 2px solid var(--border);
      margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    }
    .rank-1 .podium-avatar { border-color: var(--gold); width: 80px; height: 80px; font-size: 2rem; }

    .podium-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
    .podium-score { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .podium-score span { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

    /* --- RANKING LIST --- */
    .rankings-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .rank-row {
      display: grid;
      grid-template-columns: 60px 50px 1fr 100px;
      align-items: center;
      padding: 1.2rem 2rem;
      border-bottom: 1px solid var(--border);
      transition: 0.2s;
    }
    .rank-row:last-child { border-bottom: none; }

    /* Highlight the User */
    .rank-row.is-user {
      background: var(--bg-side);
      border-left: 5px solid var(--primary);
    }

    .r-num { font-weight: 800; color: var(--text-muted); }
    .r-avatar { width: 35px; height: 35px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.8rem; }
    .r-name { font-weight: 700; padding-left: 10px; }
    .r-score { text-align: right; font-weight: 900; color: var(--primary); font-size: 1.1rem; }

    .btn-action {
      display: block; width: fit-content; margin: 2.5rem auto 0;
      background: var(--primary); color: white;
      padding: 14px 32px; border-radius: 14px; text-decoration: none;
      font-weight: 700; transition: 0.3s;
    }

    .empty-state { text-align: center; padding: 60px; color: var(--text-muted); border: 2px dashed var(--border); border-radius: 20px; }
  </style>
</head>
<body>

<div class="layout-wrapper">
  <!-- Sidebar POINTING TO YOUR CORRECT FILENAMES -->
  <aside class="sidebar">
    <a href="Dashboard-student.html" class="logo">Rural<span>Learning</span></a>
    <ul class="nav-menu">
      <li><a href="Dashboard-student.html">🏠 Dashboard</a></li>
      <li><a href="Tutorials.html">📹 Video Lessons</a></li>
      <li><a href="Assignments.html">✏️ Assignments</a></li>
     <li><a href="Quiz.html">⏱️ Quizzes</a></li>
      <li><a href="Materials.html">📄 Study Library</a></li>
      <li><a href="Progress.html">📊 My Reports</a></li>
      <li><a href="Scoreboard.html" class="active">🏆 Board</a></li>
    </ul>

    <div style="margin-top: auto; padding: 12px; background: white; border: 1px solid var(--border); border-radius: 16px; display: flex; align-items: center; gap: 10px;">
        <div id="footer-init" style="width: 35px; height: 35px; border-radius: 8px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800;">?</div>
        <div>
            <div id="footer-name" style="font-weight:700; font-size:0.8rem;">Loading...</div>
            <div id="footer-class" style="font-size:0.65rem; color:var(--text-muted);">fetching profile</div>
        </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <h1>The Honor Board</h1>
      <p>Recognizing our top performing scholars of the week.</p>
      <div class="timer-badge">⏳ Leaderboard resets weekly</div>
    </header>

    <div id="scoreboard-render-zone">
        <!-- TOP 3 WINNERS GO HERE -->
        <section class="podium-container" id="podium-area"></section>

        <!-- REST OF THE LIST GOES HERE -->
        <section class="rankings-box" id="rankings-list"></section>
    </div>

    <a href="Quiz.html" class="btn-action">Take a Quiz to Climb 🚀</a>
  </main>
</div>

<script>
    /**
     * SCOREBOARD ENGINE - AUTOMATED FOR MYSQL
     */
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Auth Guard (via api.js/main.js)
        const user = getUser(); 
        if (!user) {
            window.location.replace('login.html');
            return;
        }

        // 2. Setup Profile UI
        document.getElementById('footer-name').innerText = user.name;
        document.getElementById('footer-class').innerText = user.studentClass ? user.studentClass.toUpperCase() : "Faculty";
        document.getElementById('footer-init').innerText = user.name.charAt(0).toUpperCase();

        // 3. Load Board Data from MySQL
        fetchBoardData(user.id);

        document.body.style.opacity = '1';
    });

    async function fetchBoardData(currentUserId) {
        const podiumArea = document.getElementById('podium-area');
        const rankingList = document.getElementById('rankings-list');

        /**
         * CONNECTION POINT:
         * const response = await AcademicAPI.getScoreboard();
         * const students = response.data; // Array of student objects
         */
        const students = []; // Database result lands here

        if (!students || students.length === 0) {
            document.getElementById('scoreboard-render-zone').innerHTML = `
                <div class="empty-state">
                    <h3>The board is empty.</h3>
                    <p style="font-size: 0.8rem; margin-top:5px;">No scores recorded this week. Be the first to take a quiz!</p>
                </div>`;
            return;
        }

        // Sort students by points descending (just in case backend didn't)
        students.sort((a, b) => b.points - a.points);

        // ── 1. RENDER PODIUM (Top 3) ──
        const top3 = students.slice(0, 3);
        // Map podium to specific ranks: [2nd, 1st, 3rd] for visual layout
        const podiumLayout = [
            top3[1] ? { ...top3[1], rank: 2, medal: '🥈' } : null,
            top3[0] ? { ...top3[0], rank: 1, medal: '🥇' } : null,
            top3[2] ? { ...top3[2], rank: 3, medal: '🥉' } : null
        ];

        podiumArea.innerHTML = podiumLayout.map(s => s ? `
            <div class="podium-card rank-${s.rank}">
                <span class="medal">${s.medal}</span>
                <div class="podium-avatar">${s.name.charAt(0)}</div>
                <div class="podium-name">${s.name}</div>
                <div class="podium-score">${s.points} <span>pts</span></div>
            </div>
        ` : '<div></div>').join('');

        // ── 2. RENDER DETAILED LIST (All Students) ──
        rankingList.innerHTML = students.map((s, index) => {
            const isMe = s.id == currentUserId;
            return `
                <div class="rank-row ${isMe ? 'is-user' : ''}">
                    <span class="r-num">${index + 1}</span>
                    <div class="r-avatar" style="${isMe ? 'background:var(--primary); color:white;' : ''}">${isMe ? 'YOU' : s.name.charAt(0)}</div>
                    <span class="r-name">${s.name}</span>
                    <span class="r-score">${s.points}</span>
                </div>
            `;
        }).join('');
    }
</script>

</body>
</html>
