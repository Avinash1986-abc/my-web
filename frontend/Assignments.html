<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Assignments — Rural Learning Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<script src="api.js"></script>
<script src="main.js"></script>
<style>
    :root {
      --primary: #52b788;
      --primary-soft: rgba(82, 183, 136, 0.1);
      --bg: #081c15;
      --card: rgba(255, 255, 255, 0.04);
      --sidebar: #0b251d;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --border: rgba(82, 183, 136, 0.15);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      --accent: #f4a261;
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: var(--bg); 
      color: var(--text); 
      min-height: 100vh; 
      opacity: 0; 
      transition: opacity 0.5s ease;
      display: flex;
    }

    /* background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(circle at 80% 20%, rgba(82, 183, 136, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 10% 80%, rgba(244, 162, 97, 0.03) 0%, transparent 40%);
      pointer-events: none;
    }

    .wrap { display: flex; width: 100%; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 40px 24px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .logo { 
      font-family: 'Playfair Display'; 
      font-size: 1.5rem; 
      font-weight: 900; 
      text-decoration: none; 
      color: var(--text); 
      display: block; 
      margin-bottom: 48px; 
    }
    .logo span { color: var(--primary); }

    .nav-menu { list-style: none; flex-grow: 1; }
    .nav-link { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 14px 16px; 
      text-decoration: none; 
      color: var(--text-muted); 
      border-radius: 14px; 
      font-weight: 600; 
      transition: 0.3s; 
      margin-bottom: 5px; 
    }
    .nav-link:hover, .nav-link.active { 
      background: var(--primary-soft); 
      color: var(--primary); 
      box-shadow: 0 4px 20px rgba(82, 183, 136, 0.08);
    }

    .profile-footer {
      background: var(--card); 
      border: 1px solid var(--border);
      padding: 12px; 
      border-radius: 16px; 
      display: flex; 
      align-items: center; 
      gap: 12px;
      margin-top: auto;
    }
    .profile-avatar { 
      width: 36px; 
      height: 36px; 
      background: var(--primary); 
      color: #081c15; 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 800; 
      font-size: 0.9rem; 
    }

    /* MAIN */
    .main { 
      flex: 1; 
      padding: 40px 60px; 
      max-width: 1000px; 
      margin: 0 auto; 
      width: 100%;
      animation: fadeInUp 0.8s ease;
    }
    .page-head h1 { font-family: 'Playfair Display'; font-size: 2.2rem; margin-bottom: 32px; }

    .card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 24px; 
      padding: 32px; 
      margin-bottom: 32px; 
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .card-title { font-family: 'Playfair Display'; font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .fg { margin-bottom: 1.1rem; }
    .fg.full { grid-column: 1/-1; }
    label { display: block; font-size: 0.7rem; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
    
    input, select, textarea { 
      width: 100%; 
      padding: 12px 16px; 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      background: rgba(255,255,255,0.02); 
      font-family: inherit; 
      color: var(--text);
      outline: none;
      transition: 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      background: rgba(82, 183, 136, 0.05);
    }

    .btn-pub { 
      width: 100%; 
      padding: 16px; 
      background: var(--primary); 
      color: #081c15; 
      border: none; 
      border-radius: 12px; 
      font-weight: 800; 
      cursor: pointer; 
      font-size: 1rem; 
      margin-top: 10px;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(82, 183, 136, 0.2);
    }
    .btn-pub:hover { 
      background: #409a71; 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(82, 183, 136, 0.3);
    }

    .table-card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 24px; 
      padding: 24px; 
      overflow: hidden; 
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--text-muted); padding: 18px 24px; border-bottom: 1px solid var(--border); letter-spacing: 0.5px; }
    td { padding: 18px 24px; font-size: 0.9rem; border-bottom: 1px solid var(--border); color: var(--text); }
    tr:last-child td { border-bottom: none; }
    
    .t-title { font-weight: 700; }
    .t-del { 
      color: var(--red); 
      font-weight: 700; 
      background: none; 
      border: none; 
      cursor: pointer; 
      transition: 0.2s;
    }
    .t-del:hover {
      text-decoration: underline;
    }
    .t-tag { 
      background: var(--primary-soft); 
      color: var(--primary); 
      padding: 4px 12px; 
      border-radius: 6px; 
      font-size: 0.75rem; 
      font-weight: 800;
      border: 1px solid rgba(82, 183, 136, 0.15);
    }
    .due-soon { color: var(--accent); font-weight: 700; }
    .due-over { color: var(--red); font-weight: 700; }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>
<div class="wrap">
    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="#" class="logo">Rural<span>Learning</span></a>
        <nav class="nav-menu">
            <a href="Dashboard-teacher.html" class="nav-link">📊 Dashboard</a>
            <a href="Upload-video.html" class="nav-link">🎥 Video Lectures</a>
            <a href="Assignments.html" class="nav-link active">✏️ Student Tasks</a>
            <a href="Quiz.html" class="nav-link">⏱️ Quiz Creator</a>
            <a href="Materials.html" class="nav-link">📄 Study Notes</a>
            <a href="Chat.html" class="nav-link">💬 Classroom Chat</a>
            
            <div style="margin: 40px 0 10px; font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Personal Analytics</div>
            <a href="Teacher-profile.html" class="nav-link">👤 My Profile</a>
            <a href="#" onclick="logout()" class="nav-link" style="color: #ef4444; margin-top: 40px;">🚪 Logout Session</a>
        </nav>
        <div class="profile-footer">
            <div class="profile-avatar" id="footer-init">?</div>
            <div>
                <div id="footer-name" style="font-weight:700; font-size:0.85rem; color: var(--text);">Loading...</div>
                <div id="footer-class" style="font-size:0.7rem; color:var(--text-muted);">fetching profile</div>
            </div>
        </div>
    </aside>

  <main class="main">
    <div class="page-head"><h1>Assignments</h1></div>

    <!-- CREATE -->
    <div class="card">
      <div class="card-title">📋 Assign New Homework</div>
      <div class="form-grid">
        <div class="fg"><label>Assignment Title</label><input id="aTitle" type="text" placeholder="e.g. Unit 1 Worksheet"></div>
        <div class="fg"><label>Subject</label><input id="aSubject" type="text" placeholder="e.g. Mathematics"></div>
        <div class="fg"><label>Target Class</label><input id="aClass" type="text" placeholder="e.g. Class 10"></div>
        <div class="fg"><label>Due Date</label><input id="aDate" type="date"></div>
        <div class="fg full"><label>Instructions / Description</label><textarea id="aDesc" rows="3" placeholder="Enter tasks for students..."></textarea></div>
      </div>
      <button class="btn-pub" id="createBtn">🚀 POST ASSIGNMENT</button>
    </div>

    <!-- LIST -->
    <h3 style="font-family: 'Playfair Display'; font-size: 1.4rem; margin-bottom:15px;">Your Posted Assignments</h3>
    <div class="table-card">
      <table>
        <thead>
          <tr><th>Title</th><th>Subject</th><th>Class</th><th>Due Date</th><th>Action</th></tr>
        </thead>
        <tbody id="aTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const user = getUser();
    if (!user) { window.location.replace('Login.html'); return; }
    if (user.role !== 'teacher') { window.location.replace('Assignments-student.html'); return; }

    document.getElementById('footer-name').innerText = user.name;
    document.getElementById('footer-init').innerText = user.name.charAt(0).toUpperCase();
    document.getElementById('footer-class').innerText = "Faculty Member";

    loadAssignments();
    document.getElementById('createBtn').onclick = handleCreate;
    document.body.style.opacity = '1';
});

async function loadAssignments() {
    const body = document.getElementById('aTableBody');
    try {
        const res = await ContentAPI.getAssignments();
        const assignments = Array.isArray(res) ? res : (res.assignments || []);
        
        if (assignments.length === 0) {
            body.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted);">No assignments posted yet.</td></tr>';
            return;
        }
        body.innerHTML = assignments.map(a => {
            const due     = new Date(a.dueDate);
            const today   = new Date();
            const diffDay = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
            const dueCls  = diffDay < 0 ? 'due-over' : diffDay <= 2 ? 'due-soon' : '';
            const dueLabel = diffDay < 0 ? '⚠️ Overdue' : diffDay === 0 ? '⚠️ Today' : due.toLocaleDateString();
            return `
                <tr>
                    <td class="t-title">${a.title}</td>
                    <td><span class="t-tag">${a.subject}</span></td>
                    <td>${a.targetClass || '—'}</td>
                    <td class="${dueCls}">${dueLabel}</td>
                    <td><button class="t-del" onclick="deleteAssignment(${a.id})">🗑 Delete</button></td>
                </tr>`;
        }).join('');
    } catch(e) { console.error("Load failed", e); }
}

async function handleCreate() {
    const title   = document.getElementById('aTitle').value.trim();
    const dueDate = document.getElementById('aDate').value;
    if (!title || !dueDate) return alert("Please fill in the title and due date.");

    const btn = document.getElementById('createBtn');
    btn.disabled = true; btn.innerText = "⏳ Posting...";
    try {
        const res = await ContentAPI.createAssignment({
            title,
            subject:     document.getElementById('aSubject').value,
            targetClass: document.getElementById('aClass').value,
            dueDate,
            description: document.getElementById('aDesc').value
        });
        if (res.success) { alert("✅ Assignment Published!"); window.location.reload(); }
        else alert("Failed: " + res.message);
    } catch(e) { alert("Server Error."); }
    finally { btn.disabled = false; btn.innerText = "🚀 POST ASSIGNMENT"; }
}

async function deleteAssignment(id) {
    if (!confirm("Delete this assignment?")) return;
    try {
        const res = await ContentAPI.deleteAssignment(id);
        if (res.success) loadAssignments();
    } catch(e) { alert("Error deleting."); }
}

function logout() {
    sessionStorage.clear();
    window.location.replace('Login.html');
}
</script>
</body>
</html>
