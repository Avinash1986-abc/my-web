<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Library — Rural Learning Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  
  <script src="api.js"></script>
  <script src="main.js"></script>

  <style>
    :root {
      --primary: #52b788;
      --primary-soft: rgba(82, 183, 136, 0.1);
      --bg: #081c15;
      --card: rgba(255, 255, 255, 0.04);
      --sidebar: #0b251d;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --border: rgba(82, 183, 136, 0.15);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      --accent: #f4a261;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.5s ease;
      overflow-y: auto;
    }

    /* background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(circle at 80% 20%, rgba(82, 183, 136, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 10% 80%, rgba(244, 162, 97, 0.03) 0%, transparent 40%);
      pointer-events: none;
    }

    .layout-wrapper { display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 40px 24px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .logo { 
      font-family: 'Playfair Display'; 
      font-size: 1.5rem; 
      font-weight: 900; 
      text-decoration: none; 
      color: var(--text); 
      display: block; 
      margin-bottom: 48px; 
    }
    .logo span { color: var(--primary); }

    .nav-menu { list-style: none; flex-grow: 1; }
    .nav-link { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 14px 16px; 
      text-decoration: none; 
      color: var(--text-muted); 
      border-radius: 14px; 
      font-weight: 600; 
      transition: 0.3s; 
      margin-bottom: 5px; 
    }
    .nav-link:hover, .nav-link.active { 
      background: var(--primary-soft); 
      color: var(--primary); 
      box-shadow: 0 4px 20px rgba(82, 183, 136, 0.08);
    }

    /* MAIN CONTENT */
    .main-content { 
      flex: 1; 
      padding: 40px 60px; 
      max-width: 1000px; 
      margin: 0 auto; 
      width: 100%; 
      animation: fadeInUp 0.8s ease;
    }

    .header-area {
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      margin-bottom: 40px;
    }

    .search-box {
      background: var(--card); 
      border: 1px solid var(--border);
      padding: 12px 20px; 
      border-radius: 14px; 
      width: 320px; 
      display: flex;
      align-items: center;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .search-box input { 
      background: transparent; 
      border: none; 
      outline: none; 
      width: 100%; 
      margin-left: 10px; 
      color: var(--text);
      font-family: inherit;
    }
    .search-box input::placeholder {
      color: var(--text-muted);
    }

    /* SUBJECT GROUPING */
    .subject-section { margin-bottom: 40px; }
    .subject-title {
      font-size: 0.75rem; 
      text-transform: uppercase; 
      letter-spacing: 1.5px;
      color: var(--primary); 
      margin-bottom: 20px; 
      display: flex;
      align-items: center; 
      gap: 15px; 
      font-weight: 800;
    }
    .subject-title::after { 
      content: ""; 
      height: 1px; 
      flex: 1; 
      background: var(--border); 
    }

    /* CARDS */
    .material-card {
      background: var(--card); 
      border: 1px solid var(--border);
      border-radius: 20px; 
      padding: 20px 24px; 
      display: flex;
      align-items: center; 
      gap: 20px; 
      margin-bottom: 16px; 
      transition: 0.3s;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }
    .material-card:hover { 
      border-color: var(--primary); 
      transform: translateY(-4px); 
      background: rgba(82, 183, 136, 0.03);
    }

    .file-icon {
      width: 50px; 
      height: 50px; 
      background: var(--primary-soft);
      color: var(--primary); 
      border-radius: 14px; 
      display: flex;
      align-items: center; 
      justify-content: center; 
      font-size: 1.4rem;
    }

    .file-info h3 { font-size: 1.05rem; color: var(--text); margin-bottom: 4px; font-weight: 700; }
    .meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 15px; }

    .download-btn {
      background: var(--primary); 
      color: #081c15; 
      border: none;
      padding: 10px 20px; 
      border-radius: 12px; 
      font-weight: 700;
      cursor: pointer; 
      text-decoration: none; 
      margin-left: auto;
      transition: 0.3s;
    }
    .download-btn:hover {
      background: #409a71;
      transform: translateY(-2px);
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.1); 
      color: #ef4444; 
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 10px 20px; 
      border-radius: 12px; 
      font-weight: 700;
      cursor: pointer; 
      margin-left: 8px;
      transition: 0.3s;
    }
    .delete-btn:hover { 
      background: #ef4444; 
      color: white;
    }

    /* UPLOAD SECTION FOR TEACHERS */
    .upload-section {
      background: var(--card); 
      border: 1px solid var(--border);
      border-radius: 24px; 
      padding: 32px; 
      margin-bottom: 40px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    .upload-title { font-family: 'Playfair Display'; font-size: 1.5rem; margin-bottom: 24px; color: var(--text); }

    .upload-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .form-group label { display: block; font-size: 0.7rem; font-weight: 800; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%; 
      padding: 12px 16px; 
      border: 1px solid var(--border);
      border-radius: 12px; 
      font-family: inherit;
      font-size: 0.9rem; 
      outline: none; 
      transition: 0.3s;
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--primary);
      background: rgba(82, 183, 136, 0.05);
    }

    .form-group select option {
      background: var(--sidebar);
      color: var(--text);
    }

    .drop-zone {
      border: 2px dashed var(--border); 
      border-radius: 16px; 
      padding: 32px;
      text-align: center; 
      cursor: pointer; 
      transition: 0.3s; 
      background: rgba(255, 255, 255, 0.01);
      grid-column: 1 / -1;
    }

    .drop-zone:hover, .drop-zone.over { 
      border-color: var(--primary); 
      background: rgba(82, 183, 136, 0.04); 
    }

    .drop-icon { font-size: 2.2rem; margin-bottom: 12px; }

    .file-selected { display: none; font-size: 0.85rem; color: var(--primary); font-weight: 700; margin-top: 10px; }

    .file-selected.show { display: block; }

    .upload-btn {
      background: var(--primary); 
      color: #081c15; 
      border: none;
      padding: 14px 28px; 
      border-radius: 12px; 
      font-weight: 700; 
      cursor: pointer;
      width: 100%; 
      grid-column: 1 / -1; 
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(82, 183, 136, 0.2);
    }

    .upload-btn:hover { 
      background: #409a71; 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(82, 183, 136, 0.3);
    }

    .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .progress-bar { display: none; margin-top: 20px; grid-column: 1 / -1; }

    .progress-track { background: rgba(255, 255, 255, 0.05); height: 8px; border-radius: 10px; overflow: hidden; }

    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.15s; }

    .progress-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }

    .profile-footer {
      background: var(--card); 
      border: 1px solid var(--border);
      padding: 12px; 
      border-radius: 16px; 
      display: flex; 
      align-items: center; 
      gap: 12px;
      margin-top: auto;
    }
    .profile-avatar { 
      width: 36px; 
      height: 36px; 
      background: var(--primary); 
      color: #081c15; 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 800; 
      font-size: 0.9rem; 
    }

    .empty-state { 
      text-align: center; 
      padding: 60px; 
      color: var(--text-muted); 
      border: 2px dashed var(--border); 
      border-radius: 24px; 
      background: var(--card);
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="layout-wrapper">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="#" class="logo">Rural<span>Learning</span></a>
    <ul class="nav-menu" id="dynamic-nav">
      <!-- Injected Dynamically Based on Role -->
    </ul>

    <div class="profile-footer">
      <div class="profile-avatar" id="footer-init">?</div>
      <div>
        <div id="footer-name" style="font-weight:700; font-size:0.85rem; color: var(--text);">Loading...</div>
        <div id="footer-class" style="font-size:0.7rem; color:var(--text-muted);">Fetching Session</div>
      </div>
    </div>
  </aside>

  <!-- Main Area -->
  <main class="main-content">
    <header class="header-area">
      <div>
        <h1 style="font-family: 'Playfair Display'; font-size: 2.2rem; font-weight: 800;">Study Library</h1>
        <p style="color: var(--text-muted); margin-top: 4px;">Reference notes and PDFs curated by your mentors.</p>
      </div>
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="lib-search" placeholder="Search for files...">
      </div>
    </header>

    <!-- TEACHER UPLOAD SECTION -->
    <div id="teacher-upload" style="display: none;">
      <div class="upload-section">
        <h2 class="upload-title">📤 Upload Study Material</h2>
        <form class="upload-form" id="material-form" onsubmit="uploadMaterial(event)">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="mat-title" placeholder="e.g. Chapter 3 Notes" required>
          </div>
          <div class="form-group">
            <label>Subject</label>
            <select id="mat-subject" required>
              <option>Mathematics</option>
              <option>Science</option>
              <option>English</option>
              <option>Physics</option>
              <option>Chemistry</option>
              <option>Biology</option>
              <option>History</option>
              <option>Geography</option>
            </select>
          </div>
          <div class="form-group">
            <label>Target Class</label>
            <input type="text" id="mat-class" placeholder="e.g. Class 10">
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>Description</label>
            <textarea id="mat-desc" placeholder="Brief description of the material..." rows="2"></textarea>
          </div>
          <div class="drop-zone" id="dropZone" onclick="document.getElementById('mat-file').click()">
            <div class="drop-icon">📁</div>
            <div><strong>Drop file here or click to browse</strong></div>
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">PDF, PPT, PPTX, DOCX · Max 200 MB</div>
            <div class="file-selected" id="fileSelected">✅ <span id="fileName"></span></div>
            <input type="file" id="mat-file" accept=".pdf,.ppt,.pptx,.doc,.docx" hidden>
          </div>
          <button type="submit" class="upload-btn" id="upload-btn">🚀 Publish Material</button>
        </form>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-label">Uploading... <span id="progress-pct">0%</span></div>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
      </div>
    </div>

    <div id="library-container">
        <div class="empty-state">Connecting to Server...</div>
    </div>
  </main>
</div>

<script>
    let selectedFile = null;
    let allMaterials = [];

    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Auth Guard
        const user = getUser(); // Provided by api.js
        if (!user) {
            window.location.replace('Login.html');
            return;
        }

        // 2. Personalize UI
        if(document.getElementById('footer-name')) document.getElementById('footer-name').innerText = user.name;
        if(document.getElementById('footer-class')) document.getElementById('footer-class').innerText = user.studentClass ? ("CLASS " + user.studentClass.toUpperCase()) : "Faculty Member";
        if(document.getElementById('footer-init')) document.getElementById('footer-init').innerText = user.name.charAt(0).toUpperCase();
        
        // 3. Render Dynamic Sidebar
        renderSidebar(user);

        // 4. Show teacher upload if user is teacher
        if (user.role === 'teacher') {
            const uploadSection = document.getElementById('teacher-upload');
            if(uploadSection) {
                uploadSection.style.display = 'block';
                setupDropZone();
            }
        }

        // 5. Load Materials
        loadMaterials(user);

        // Setup search trigger
        const searchInput = document.getElementById('lib-search');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                filterMaterials(query, user);
            });
        }

        document.body.style.opacity = '1';
    });

    // Render navigation links dynamically
    function renderSidebar(user) {
        const nav = document.getElementById('dynamic-nav');
        if (!nav) return;

        if (user.role === 'teacher') {
            nav.innerHTML = `
                <a href="Dashboard-teacher.html" class="nav-link">📊 Dashboard</a>
                <a href="Upload-video.html" class="nav-link">🎥 Video Lectures</a>
                <a href="Assignments.html" class="nav-link">✏️ Student Tasks</a>
                <a href="Quiz.html" class="nav-link">⏱️ Quiz Creator</a>
                <a href="Materials.html" class="nav-link active">📄 Study Notes</a>
                <a href="Chat.html" class="nav-link">💬 Classroom Chat</a>
                <div style="margin: 40px 0 10px; font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Personal Analytics</div>
                <a href="Teacher-profile.html" class="nav-link">👤 My Profile</a>
                <a href="#" onclick="logout()" class="nav-link" style="color: #ef4444; margin-top: 40px;">🚪 Sign Out</a>
            `;
        } else {
            nav.innerHTML = `
                <a href="Dashboard-student.html" class="nav-link">🏠 Dashboard</a>
                <a href="Tutorials.html" class="nav-link">🎥 Video Lessons</a>
                <a href="Assignments.html" class="nav-link">✏️ Assignments</a>
                <a href="Quiz.html" class="nav-link">⏱️ Quizzes</a>
                <a href="Materials.html" class="nav-link active">📄 Study Library</a>
                <a href="Chat.html" class="nav-link">💬 Classroom Chat</a>
                <div style="margin: 40px 0 10px; font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Personal Analytics</div>
                <a href="student-profile.html" class="nav-link">👤 My Profile</a>
                <a href="#" onclick="logout()" class="nav-link" style="color: #ef4444; margin-top: 40px;">🚪 Sign Out</a>
            `;
        }
    }

    // ── DRAG & DROP ──
    function setupDropZone() {
        const zone = document.getElementById('dropZone');
        const input = document.getElementById('mat-file');
        if(!zone || !input) return;

        zone.addEventListener('dragenter', e => { e.preventDefault(); zone.style.borderColor = 'var(--primary)'; });
        zone.addEventListener('dragover', e => { e.preventDefault(); });
        zone.addEventListener('dragleave', e => { zone.style.borderColor = 'var(--border)'; });
        zone.addEventListener('drop', e => {
            e.preventDefault();
            zone.style.borderColor = 'var(--border)';
            const file = e.dataTransfer.files[0];
            if (file) selectFile(file);
        });

        input.addEventListener('change', e => {
            if (e.target.files[0]) selectFile(e.target.files[0]);
        });
    }

    function selectFile(file) {
        if (file.size > 209715200) { // 200MB
            alert('File exceeds 200 MB limit.');
            return;
        }
        selectedFile = file;
        document.getElementById('fileName').innerText = file.name + ' (' + formatSize(file.size) + ')';
        document.getElementById('fileSelected').classList.add('show');
        if (!document.getElementById('mat-title').value) {
            document.getElementById('mat-title').value = file.name.replace(/\.[^.]+$/, '');
        }
    }

    function formatSize(bytes) {
        if (!bytes) return '0 KB';
        if (bytes >= 1e6) return (bytes / 1e6).toFixed(1) + ' MB';
        return (bytes / 1024).toFixed(0) + ' KB';
    }

    // ── UPLOAD (Triggered by form onsubmit) ──
    async function uploadMaterial(e) {
        if(e) e.preventDefault();
        
        if (!selectedFile) {
            alert('Please select a file first.');
            return;
        }

        const title = document.getElementById('mat-title').value.trim();
        const subject = document.getElementById('mat-subject').value;
        const cls = document.getElementById('mat-class').value.trim();
        const desc = document.getElementById('mat-desc').value.trim();

        const btn = document.getElementById('upload-btn');
        btn.disabled = true;
        btn.innerText = '⏳ Uploading...';

        const progBar = document.getElementById('progress-bar');
        const progFill = document.getElementById('progress-fill');
        const progPct = document.getElementById('progress-pct');
        if(progBar) progBar.style.display = 'block';

        try {
            await xhrUploadMaterial(selectedFile, title, subject, cls, desc, pct => {
                if(progFill) progFill.style.width = pct + '%';
                if(progPct) progPct.innerText = pct + '%';
            });

            alert('✅ Material published successfully!');
            document.getElementById('material-form').reset();
            selectedFile = null;
            document.getElementById('fileSelected').classList.remove('show');
            if(progBar) progBar.style.display = 'none';
            
            loadMaterials(getUser());
        } catch (err) {
            alert('❌ Upload failed: ' + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = '🚀 Publish Material';
        }
    }

    function xhrUploadMaterial(file, title, subject, cls, desc, onProgress) {
        return new Promise((resolve, reject) => {
            const fd = new FormData();
            fd.append('material', file); 
            fd.append('title', title);
            fd.append('subject', subject);
            fd.append('targetClass', cls);

            const xhr = new XMLHttpRequest();
            xhr.upload.onprogress = e => {
                if (e.lengthComputable) {
                    onProgress(Math.round(e.loaded / e.total * 100));
                }
            };
            xhr.onload = () => {
                const res = JSON.parse(xhr.responseText || '{}');
                if (xhr.status >= 200 && xhr.status < 300) {
                    resolve(res);
                } else {
                    reject(new Error(res.message || 'Server error'));
                }
            };
            xhr.onerror = () => reject(new Error('Network error'));
            
            xhr.open('POST', BASE_URL + '/materials/upload');
            
            const token = getToken(); 
            if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
            xhr.send(fd);
        });
    }

    // ── DELETE ──
    async function deleteMaterial(id) {
        if (!confirm('Remove this material?')) return;
        try {
            const res = await ContentAPI.deleteMaterial(id);
            if (res && res.success) {
                alert('✅ Material removed.');
                loadMaterials(getUser());
            } else {
                alert('❌ Delete failed: ' + (res.message || 'Unknown error'));
            }
        } catch (err) {
            alert('❌ Delete failed.');
        }
    }

    // ── LOAD ──
    async function loadMaterials(user) {
        const container = document.getElementById('library-container');
        if(!container) return;
        
        try {
            const data = await ContentAPI.getMaterials();
            allMaterials = Array.isArray(data) ? data : (data.materials || []);
            renderMaterialsList(allMaterials, user);
        } catch (err) {
            container.innerHTML = `<div class="empty-state"><h3>⚠️ Error loading materials</h3></div>`;
        }
    }

    function filterMaterials(query, user) {
        if (!query) {
            renderMaterialsList(allMaterials, user);
            return;
        }
        const filtered = allMaterials.filter(m => 
            m.title.toLowerCase().includes(query) || 
            (m.subject && m.subject.toLowerCase().includes(query)) ||
            (m.teacherName && m.teacherName.toLowerCase().includes(query))
        );
        renderMaterialsList(filtered, user);
    }

    function renderMaterialsList(list, user) {
        const container = document.getElementById('library-container');
        if (!container) return;

        if (list.length === 0) {
            container.innerHTML = `<div class="empty-state"><h3>📭 No materials found.</h3></div>`;
            return;
        }

        const grouped = list.reduce((acc, obj) => {
            const key = obj.subject || 'General';
            if (!acc[key]) acc[key] = [];
            acc[key].push(obj);
            return acc;
        }, {});

        container.innerHTML = Object.keys(grouped).map(subject => `
            <section class="subject-section">
                <div class="subject-title">${subject}</div>
                ${grouped[subject].map(file => {
                    const fileExt = file.fileUrl ? file.fileUrl.split('.').pop().toUpperCase() : 'FILE';
                    let icon = '📁';
                    if (fileExt === 'PDF') icon = '📕';
                    else if (['PPT', 'PPTX'].includes(fileExt)) icon = '📙';
                    else if (['DOC', 'DOCX'].includes(fileExt)) icon = '📘';

                    const deleteBtn = user.role === 'teacher' 
                        ? `<button class="delete-btn" onclick="deleteMaterial(${file.id})">🗑 Remove</button>`
                        : '';
                    
                    const downloadUrl = file.fileUrl.startsWith('http') ? file.fileUrl : ROOT_URL + file.fileUrl;

                    return `
                        <div class="material-card">
                            <div class="file-icon">${icon}</div>
                            <div class="file-info">
                                <h3>${file.title}</h3>
                                <div class="meta">
                                    <span>👤 ${file.teacherName || 'Instructor'}</span>
                                    <span>📅 ${new Date(file.created_at || Date.now()).toLocaleDateString()}</span>
                                    ${file.targetClass ? `<span>🏷️ ${file.targetClass}</span>` : ''}
                                </div>
                            </div>
                            <a href="${downloadUrl}" class="download-btn" target="_blank">⬇️ View / Download</a>
                            ${deleteBtn}
                        </div>
                    `;
                }).join('')}
            </section>
        `).join('');
    }

    function logout() {
        sessionStorage.clear();
        window.location.replace('Login.html');
