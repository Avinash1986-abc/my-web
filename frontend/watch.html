<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watching Lesson — Rural Learning Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script src="api.js"></script>
  <script src="main.js"></script>

  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f8fafc;
      --primary: #52b788;
      --text-dark: #0f172a;
      --border: #e2e8f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg-alt); color: var(--text-dark); padding: 40px; }
    
    .player-container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); }
    
    .video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 15px; overflow: hidden; margin-bottom: 20px; }
    video { width: 100%; height: 100%; outline: none; }

    .video-info h1 { font-size: 1.8rem; margin-bottom: 10px; }
    .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: var(--primary); font-weight: 700; font-size: 0.9rem; }
    
    /* Loading state */
    .loading-overlay { position: fixed; inset: 0; background: white; display: flex; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.5s; }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loader"><h2>Loading Lecture...</h2></div>

  <div class="player-container">
    <a href="Tutorials.html" class="back-btn">← Back to Library</a>
    
    <div class="video-wrapper">
      <!-- The Video Player -->
      <video id="main-player" controls controlsList="nodownload">
        <source id="video-src" src="" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <div class="video-info">
      <h1 id="video-title">Lesson Title</h1>
      <p style="color: #64748b;">You are watching a verified lecture from the Rural Learning Portal.</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

        // ── 1. AUTH GUARD ──
        const user = getUser();
        if (!user) { window.location.replace('login.html'); return; }

        // ── 2. READ URL PARAMS ──
        const params     = new URLSearchParams(window.location.search);
        const videoUrl   = params.get('url');     // e.g. /uploads/videos/xxx.mp4
        const videoTitle = params.get('title');   // ✅ FIXED: was undefined before

        // Guard: if no URL param, go back
        if (!videoUrl) {
            alert("Video link is missing.");
            window.location.href = 'tutorials.html';
            return;
        }

        // ── 3. SET PLAYER SOURCE ──
        const backendBase = "http://localhost:5000";
        const player      = document.getElementById('main-player');  // ✅ FIXED: was 'main-video-player'
        const source      = document.getElementById('video-src');
        const titleEl     = document.getElementById('video-title');

        // Set title (fallback to 'Lesson' if missing)
        titleEl.innerText = videoTitle ? decodeURIComponent(videoTitle) : 'Lesson'; // ✅ FIXED

        // Set video source and reload player
        source.src = videoUrl.startsWith('http') ? videoUrl : backendBase + videoUrl;
        player.load();

        // ── 4. HIDE LOADER ──
        setTimeout(() => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }, 800);

    });
  </script>
</body>
</html>
