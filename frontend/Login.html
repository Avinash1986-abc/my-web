<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Rural Learning Portal</title>
<script src="api.js"></script>
<script src="main.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #52b788;
    --primary-soft: rgba(82, 183, 136, 0.1);
    --bg: #081c15;
    --card: rgba(255, 255, 255, 0.03);
    --text: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.6);
    --border: rgba(82, 183, 136, 0.15);
    --shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
    --accent: #f4a261;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--text);
    position: relative;
  }

  /* floating orbs background animation */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image: radial-gradient(circle at 80% 20%, rgba(82, 183, 136, 0.06) 0%, transparent 50%),
                      radial-gradient(circle at 10% 80%, rgba(244, 162, 97, 0.04) 0%, transparent 40%);
    pointer-events: none;
  }

  .orbs {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    animation: float 12s infinite alternate ease-in-out;
  }
  .orb-1 {
    top: -10%;
    left: -10%;
    width: 300px;
    height: 300px;
    background: var(--primary);
  }
  .orb-2 {
    bottom: -10%;
    right: -10%;
    width: 400px;
    height: 400px;
    background: var(--accent);
    animation-delay: -4s;
  }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(40px, 30px) scale(1.1); }
  }

  .container {
    position: relative;
    z-index: 10;
    display: flex;
    width: min(900px, 95vw);
    height: min(580px, 90vh);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: var(--shadow);
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
  }

  .left-panel {
    flex: 1;
    background: linear-gradient(135deg, rgba(82, 183, 136, 0.06) 0%, rgba(11, 37, 29, 0.4) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  
  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 900;
    color: var(--text);
    line-height: 1.2;
    margin-top: 15px;
  }
  .brand-name span { color: var(--primary); }

  .right-panel {
    width: 460px;
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: rgba(8, 28, 21, 0.5);
  }

  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-size: 0.7rem;
    font-weight: 800;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .input-wrap { display: flex; }
  .input-wrap input {
    flex: 1;
    padding: 14px 18px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
    background: rgba(255, 255, 255, 0.02);
    color: var(--text);
    font-family: inherit;
  }
  .input-wrap input:focus {
    border-color: var(--primary);
    background: rgba(82, 183, 136, 0.05);
  }
  .input-wrap input::placeholder {
    color: rgba(255, 255, 255, 0.3);
  }
  
  .btn-login {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    border: none;
    border-radius: 12px;
    color: #081c15;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
    box-shadow: 0 4px 15px rgba(82, 183, 136, 0.25);
  }
  .btn-login:hover {
    background: #409a71;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(82, 183, 136, 0.35);
  }
  .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

  a { color: var(--primary); text-decoration: none; font-weight: 700; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>
<div class="container">
  <div class="left-panel">
    <div style="font-size: 60px; filter: drop-shadow(0 0 10px rgba(82,183,136,0.3));">📚</div>
    <div class="brand-name">Rural Learning<br><span>Portal</span></div>
    <p style="color: var(--text-muted); margin-top:15px; font-size: 14px; font-weight: 500;">Access your education gateway 🌱</p>
  </div>
  <div class="right-panel">
    <h2 style="font-family: 'Playfair Display'; font-size: 2.2rem; color: var(--text); margin-bottom: 6px;">Welcome Back 👋</h2>
    <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 32px;">Enter your credentials to continue</p>
    
    <div id="pass-section">
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Registered Email</label>
                <div class="input-wrap">
                    <input type="email" id="email" name="email" placeholder="e.g. yourname@gmail.com" autocomplete="email" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Security Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn-login" id="passBtn">Login to My Account</button>
        </form>
    </div>

    <p style="text-align:center; margin-top:32px; font-size:14px; color: var(--text-muted);">New to the portal? <a href="Register.html">Create Account</a></p>
  </div>
</div>

<script>
  async function handleLogin(e) {
    e.preventDefault();
    
    const btn = document.getElementById('passBtn');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const originalText = btn.textContent;
    btn.textContent = "⌛ Authenticating...";
    btn.disabled = true;

    try {
        const res = await AuthAPI.login({ email, password }); 

        if (res && res.success) {
            sessionStorage.setItem('currentUser', JSON.stringify(res.user));
            sessionStorage.setItem('rlt_token', res.token);

            if (res.user.role === 'teacher') {
                console.log("Teacher Identity Verified.");
                window.location.replace('Dashboard-teacher.html');
            } else {
                console.log("Student Identity Verified.");
                window.location.replace('Dashboard-student.html');
            }
        } else {
            alert("❌ Login Failed: " + (res.message || "Invalid Email or Password"));
            btn.textContent = originalText;
            btn.disabled = false;
        }
    } catch (err) {
        console.error("Auth Error:", err);
        alert("❌ Network Error: Unable to reach the server. Ensure 'node server.js' is running.");
        btn.textContent = originalText;
        btn.disabled = false;
    }
}
</script>
</body>
</html>
