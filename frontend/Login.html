<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Rural Learning Portal</title>
<!-- Master UI Logic -->
<script src="api.js"></script>
<script src="main.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {--green-dark:#1a3c2e; --green-mid:#2d6a4f; --green-light:#10b981; --gold:#f4a261; --cream:#fefae0; --white:#ffffff;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body {font-family:'Nunito',sans-serif; min-height:100vh; background:var(--green-dark); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  
  .bg-animation{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#0d2818 0%,#1a3c2e 40%,#2d6a4f 100%);}
  .circle{position:absolute;border-radius:50%;opacity:.07;animation:floatUp 15s linear infinite;}
  @keyframes floatUp{0%{transform:translateY(110vh) scale(.8);opacity:0;}10%{opacity:.07;}100%{transform:translateY(-20vh) scale(1.1);opacity:0;}}

  .container{position:relative;z-index:10; display:flex; width:min(960px,95vw); height:min(580px,90vh); border-radius:28px; overflow:hidden; box-shadow:0 40px 120px rgba(0,0,0,.6); background: var(--cream);}
  .left-panel{flex:1; background:linear-gradient(160deg,#1a3c2e 0%,#2d6a4f 100%); display:flex;flex-direction:column;align-items:center;justify-content:center; padding:40px; text-align: center;}
  .brand-name{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;color:var(--white); line-height: 1.2;}
  .brand-name span{color:var(--gold);}

  .right-panel{ width:480px; background:var(--cream); padding:30px 45px; display:flex; flex-direction:column; justify-content:center;}

  .form-group{margin-bottom:15px;}
  .form-group label{display:block;font-size:11px;font-weight:800;color:var(--green-dark);margin-bottom:8px;text-transform:uppercase;letter-spacing: 0.5px;}
  .input-wrap{display: flex; gap: 10px;}
  .input-wrap input{flex: 1; padding:14px; border:2px solid #d4e8d4; border-radius:12px; font-size:14px; outline:none; transition: 0.3s; background: #fff;}
  .input-wrap input:focus{border-color: var(--green-mid); box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.05);}
  
  .btn-login{width:100%; padding:16px; background:linear-gradient(135deg,var(--green-mid),var(--green-light)); border:none; border-radius:12px; color:white; font-size:16px;font-weight:700; cursor:pointer; margin-top: 10px; transition: 0.3s;}
  .btn-login:hover{transform: translateY(-2px); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);}

  .login-switch { text-align: center; margin-top: 20px; font-size: 13px; color: var(--green-mid); cursor: pointer; font-weight: 700; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="bg-animation"><div class="circle" style="left:15%"></div><div class="circle" style="left:80%"></div></div>
<div class="container">
  <div class="left-panel">
    <div style="font-size: 50px; margin-bottom: 20px;">📚</div>
    <div class="brand-name">Rural Learning<br><span>Tutorial</span></div>
    <p style="color: #b7e4c7; margin-top:15px; font-size: 14px;">Access your education portal 🌱</p>
  </div>
  <div class="right-panel">
    <h2 style="font-family:'Playfair Display'; color:var(--green-dark); margin-bottom: 5px;">Welcome Back 👋</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 25px;">Enter your credentials to continue</p>
    
    <div id="pass-section">
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Registered Email</label>
                <div class="input-wrap"><input type="email" id="email" placeholder="e.g. name@gmail.com" required></div>
            </div>
            <div class="form-group">
                <label>Security Password</label>
                <div class="input-wrap"><input type="password" id="password" placeholder="••••••••" required></div>
            </div>
            <button type="submit" class="btn-login" id="passBtn">Login to My Account</button>
        </form>
    </div>

    <p style="text-align:center; margin-top:30px; font-size:13px; color:#666;">New to the portal? <a href="Register.html" style="color:var(--green-mid); font-weight:700; text-decoration:none;">Create Account</a></p>
  </div>
</div>

<script>
  /**
   * SMART LOGIN HANDLER
   * No role selection needed - the system detects it automatically.
   */
  async function handleLogin(e) {
    e.preventDefault();
    
    const btn = document.getElementById('passBtn');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // UI Feedback
    btn.textContent = "⌛ Authenticating...";
    btn.disabled = true;

    try {
        const res = await AuthAPI.login({ email, password }); 

        if (res && res.success) {
            // 1. Save identity to session
            localStorage.setItem('currentUser', JSON.stringify(res.user));
            localStorage.setItem('rlt_token', res.token);

            // 2. AUTOMATIC ROLE ROUTING (Senior Dev Logic)
            // We check what role the database returned for this email
            if (res.user.role === 'teacher') {
                alert("✨ Welcome, Instructor " + res.user.name);
                window.location.replace('Dashboard-teacher.html');
            } else {
                alert("📚 Happy Learning, " + res.user.name);
                window.location.replace('Dashboard-student.html');
            }
        } else {
            alert("❌ Login Failed: " + (res.message || "Invalid Email or Password"));
            btn.textContent = "Login to My Account";
            btn.disabled = false;
        }
    } catch (err) {
        alert("❌ Error: Could not connect to the authentication server.");
        btn.textContent = "Login to My Account";
        btn.disabled = false;
    }
}
</script>
</body>
</html>
