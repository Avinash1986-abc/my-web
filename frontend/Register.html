<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Rural Learning Portal</title>
<script src="api.js"></script>
<script src="main.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #52b788;
    --primary-soft: rgba(82, 183, 136, 0.1);
    --bg: #081c15;
    --card: rgba(255, 255, 255, 0.03);
    --text: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.6);
    --border: rgba(82, 183, 136, 0.15);
    --shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
    --accent: #f4a261;
    --error: #ef4444;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--text);
    position: relative;
  }

  /* floating orbs background animation */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image: radial-gradient(circle at 80% 20%, rgba(82, 183, 136, 0.06) 0%, transparent 50%),
                      radial-gradient(circle at 10% 80%, rgba(244, 162, 97, 0.04) 0%, transparent 40%);
    pointer-events: none;
  }

  .orbs {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    animation: float 12s infinite alternate ease-in-out;
  }
  .orb-1 {
    top: -10%;
    left: -10%;
    width: 300px;
    height: 300px;
    background: var(--primary);
  }
  .orb-2 {
    bottom: -10%;
    right: -10%;
    width: 400px;
    height: 400px;
    background: var(--accent);
    animation-delay: -4s;
  }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(40px, 30px) scale(1.1); }
  }

  .container {
    position: relative;
    z-index: 10;
    display: flex;
    width: min(1000px, 95vw);
    height: min(720px, 96vh);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: var(--shadow);
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
  }

  .left-panel {
    flex: 1;
    background: linear-gradient(135deg, rgba(82, 183, 136, 0.06) 0%, rgba(11, 37, 29, 0.4) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  
  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 900;
    color: var(--text);
    line-height: 1.2;
    margin-top: 15px;
  }
  .brand-name span { color: var(--primary); }

  .right-panel {
    width: 520px;
    padding: 30px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: rgba(8, 28, 21, 0.5);
    overflow-y: auto;
  }

  .role-toggle {
    display: flex;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 4px;
    margin-bottom: 20px;
    position: relative;
  }
  .role-toggle input { display: none; }
  .role-toggle label {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    border-radius: 50px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
    z-index: 1;
    transition: 0.3s;
  }
  .toggle-slider {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);
    background: var(--primary);
    border-radius: 50px;
    transition: 0.3s cubic-bezier(.34, 1.56, .64, 1);
  }
  #r-teacher:checked ~ .toggle-slider { transform: translateX(100%); }
  #r-teacher:checked ~ label[for="r-teacher"] { color: #081c15 !important; }
  #r-student:checked ~ label[for="r-student"] { color: #081c15 !important; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 0.7rem;
    font-weight: 800;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .input-wrap { display: flex; }
  .input-wrap input, .input-wrap select {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
    background: rgba(255, 255, 255, 0.02);
    color: var(--text);
    font-family: inherit;
  }
  .input-wrap input:focus, .input-wrap select:focus {
    border-color: var(--primary);
    background: rgba(82, 183, 136, 0.05);
  }
  .input-wrap input::placeholder {
    color: rgba(255, 255, 255, 0.3);
  }
  .input-wrap select option {
    background: var(--sidebar);
    color: var(--text);
  }
  
  /* ── PASS HINTS STYLE ── */
  .pass-hints {
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: none;
  }
  .hint-item { font-size: 11px; font-weight: 700; margin-bottom: 4px; color: var(--error); display: flex; align-items: center; gap: 6px; }
  .hint-item.valid { color: var(--primary); }

  .btn-register {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    border: none;
    border-radius: 12px;
    color: #081c15;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
    box-shadow: 0 4px 15px rgba(82, 183, 136, 0.25);
  }
  .btn-register:hover {
    background: #409a71;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(82, 183, 136, 0.35);
  }
  .btn-register:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .extra-fields { display: none; }
  .show { display: block; }

  a { color: var(--primary); text-decoration: none; font-weight: 700; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>
<div class="container">
  <div class="left-panel">
    <div style="font-size: 60px; filter: drop-shadow(0 0 10px rgba(82,183,136,0.3));">📚</div>
    <div class="brand-name">Rural Learning<br><span>Portal</span></div>
    <p style="color: var(--text-muted); margin-top:15px; font-size: 14px; font-weight: 500;">Bridging education gaps everywhere 🌱</p>
  </div>
  <div class="right-panel">
    <h2 style="font-family: 'Playfair Display'; font-size: 2.2rem; color: var(--text); margin-bottom: 6px;">Create Account 👋</h2>
    <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px;">Join our community today</p>
    
    <div class="role-toggle">
      <input type="radio" name="role" id="r-student" checked>
      <input type="radio" name="role" id="r-teacher">
      <label for="r-student">🎓 Student</label>
      <label for="r-teacher">👩‍🏫 Teacher</label>
      <div class="toggle-slider"></div>
    </div>

    <form onsubmit="handleRegister(event)">
      <div class="grid-2">
        <div class="form-group"><label>First Name</label><div class="input-wrap"><input type="text" id="fname" placeholder="First Name" required></div></div>
        <div class="form-group"><label>Last Name</label><div class="input-wrap"><input type="text" id="lname" placeholder="Last Name" required></div></div>
      </div>
      <div class="form-group"><label>Email Address</label><div class="input-wrap"><input type="email" id="email" placeholder="e.g. name@gmail.com" required></div></div>
      <div class="form-group"><label>Mobile Number</label><div class="input-wrap"><input type="tel" id="mobile" placeholder="Mobile Number" required></div></div>
      
      <!-- STUDENT SPECIFIC -->
      <div class="extra-fields show" id="student-box">
        <div class="form-group">
            <label>Select Your Class</label>
            <div class="input-wrap">
                <select id="s-class">
                    <option value="">Choose Class</option>
                    <option value="class-10">Class 10</option>
                    <option value="class-11">Class 11</option>
                    <option value="class-12">Class 12</option>
                </select>
            </div>
        </div>
      </div>

      <!-- TEACHER SPECIFIC -->
      <div class="extra-fields" id="teacher-box">
        <div class="form-group"><label>Expert Subject</label><div class="input-wrap"><input type="text" id="t-subject" placeholder="e.g. Mathematics"></div></div>
       
      </div>

      <div class="grid-2">
        <div class="form-group"><label>Password</label><div class="input-wrap"><input type="password" id="pass" placeholder="Create Password" required></div></div>
        <div class="form-group"><label>Confirm Password</label><div class="input-wrap"><input type="password" id="pass2" placeholder="Confirm" required></div></div>
      </div>

      <!-- LIVE PASSWORD HINTS -->
      <div class="pass-hints" id="pass-hints">
          <div class="hint-item" id="h-len">❌ Min 8 Characters</div>
          <div class="hint-item" id="h-up">❌ At least one Uppercase</div>
          <div class="hint-item" id="h-num">❌ At least one Number</div>
          <div class="hint-item" id="h-sp">❌ One Special Character (@$!%*)</div>
      </div>

      <button type="submit" class="btn-register" id="regBtn">Create My Account →</button>
    </form>

    <p style="text-align:center; margin-top:24px; font-size:14px; color: var(--text-muted);">Already have an account? <a href="Login.html">Login Now</a></p>
  </div>
</div>

<script>
  // ── 1. UI TOGGLE LOGIC ──
  const studentBtn = document.getElementById('r-student');
  const teacherBtn = document.getElementById('r-teacher');
  const studentBox = document.getElementById('student-box');
  const teacherBox = document.getElementById('teacher-box');

  studentBtn.onclick = () => { studentBox.classList.add('show'); teacherBox.classList.remove('show'); };
  teacherBtn.onclick = () => { teacherBox.classList.add('show'); studentBox.classList.remove('show'); };
  
  // ── 2. LIVE PASSWORD VALIDATION ──
  const passInput = document.getElementById('pass');
  const hintsBox  = document.getElementById('pass-hints');

  const requirements = [
    { id: 'h-len', regex: /.{8,}/ },
    { id: 'h-up',  regex: /[A-Z]/ },
    { id: 'h-num', regex: /[0-9]/ },
    { id: 'h-sp',  regex: /[@$!%*?&]/ }
  ];

  passInput.onfocus = () => hintsBox.style.display = 'block';
  passInput.oninput = () => {
      const val = passInput.value;
      requirements.forEach(req => {
          const el = document.getElementById(req.id);
          if(req.regex.test(val)) {
              el.classList.add('valid');
              el.innerHTML = el.innerHTML.replace('❌', '✅');
          } else {
              el.classList.remove('valid');
              el.innerHTML = el.innerHTML.replace('✅', '❌');
          }
      });
  };

  // ── 3. MASTER REGISTRATION HANDLER ──
  async function handleRegister(e) {
    e.preventDefault();
    
    const btn = document.getElementById('regBtn');
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    const pass2 = document.getElementById('pass2').value;
    const role = document.getElementById('r-teacher').checked ? 'teacher' : 'student';

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    if (!emailRegex.test(email)) return alert("❌ Please enter a valid email address.");
    if (!passRegex.test(pass)) return alert("❌ Password is too weak. Please check the checklist.");
    if (pass !== pass2) return alert("❌ Passwords do not match.");

    if (role === 'student' && !document.getElementById('s-class').value) {
        return alert("❌ Please select your Class.");
    }

    btn.textContent = '🛡️ Securing Account...';
    btn.disabled = true;

    const payload = {
        name: (document.getElementById('fname').value.trim() + " " + document.getElementById('lname').value.trim()),
        email: email.toLowerCase(),
        mobile: document.getElementById('mobile').value.trim(),
        password: pass,
        role: role,
        studentClass: role === 'student' ? document.getElementById('s-class').value : "Faculty",
        expertSubject: role === 'teacher' ? document.getElementById('t-subject').value : "",
    };

    try {
        const response = await AuthAPI.register(payload);

        if (response && response.success) {
            alert("✨ Welcome to Rural Learning! Account created successfully.");
            window.location.replace('Login.html');
        } else {
            throw new Error(response.message || "Registration failed.");
        }
    } catch (err) {
        alert("❌ Failed: " + err.message);
        btn.textContent = "Create My Account →";
        btn.disabled = false;
    }
  }
</script>
</body>
</html>
