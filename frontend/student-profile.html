<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Rural Learning Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Master API Engine -->
  <script src="api.js"></script>

  <style>
    :root {
      --primary: #10b981;
      --primary-lt: #f0fdf4;
      --text: #1e293b;
      --muted: #64748b;
      --bg: #f8fafc;
      --border: #f1f5f9;
      --red: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    /* --- PROFESSIONAL SIDEBAR --- */
    .side {
        width: 280px;
        background: #fff;
        border-right: 1px solid var(--border);
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
    }

    .logo { 
        font-size: 1.6rem; font-weight: 800; color: #1e293b; 
        text-decoration: none; margin-bottom: 2.5rem; display: block;
    }
    .logo span { color: var(--primary); }

    .nav-section-label {
        font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
        color: #94a3b8; letter-spacing: 0.05em; margin: 1.5rem 0 0.8rem 0.8rem;
    }

    .nav-link {
        display: flex; align-items: center; gap: 12px; padding: 12px 16px;
        text-decoration: none; color: var(--muted); font-size: 0.95rem;
        font-weight: 600; border-radius: 12px; transition: 0.2s; margin-bottom: 4px;
    }
    .nav-link:hover { background: var(--bg); color: var(--text); }
    .nav-link.on { background: var(--primary-lt); color: var(--primary); }
    .nav-link i { font-style: normal; font-size: 1.2rem; }
    .sign-out { margin-top: auto; color: var(--red) !important; }

    /* --- MAIN CONTENT --- */
    .main-content { flex: 1; padding: 3rem 5rem; }

    .profile-header {
      display: flex; align-items: center; gap: 25px; margin-bottom: 3rem;
    }
    .avatar-big {
      width: 90px; height: 90px; border-radius: 24px;
      background: var(--primary); color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; font-weight: 800;
    }
    .header-info h1 { font-size: 2rem; font-weight: 800; margin-bottom: 5px; }
    .header-info p { color: var(--muted); font-weight: 600; }

    .profile-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }

    .card {
      background: white; border: 1px solid var(--border);
      border-radius: 24px; padding: 2.5rem;
    }

    .input-group { margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    input {
      width: 100%; background: var(--bg); border: 1.5px solid var(--border);
      padding: 14px; border-radius: 12px; font-size: 1rem; outline: none; transition: 0.3s;
    }
    input:focus { border-color: var(--primary); background: white; }
    input:disabled { background: #f8fafc; color: #94a3b8; cursor: not-allowed; }

    .btn-save {
      background: var(--primary); color: white; padding: 14px;
      border-radius: 12px; font-weight: 700; border: none; cursor: pointer;
      width: 100%; font-size: 1rem; transition: 0.3s;
    }
    .btn-save:hover { opacity: 0.9; transform: translateY(-2px); }

    .achievement-item { display: flex; align-items: center; gap: 15px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>

  <!-- Synchronized Sidebar -->
  <aside class="side">
    <a href="#" class="logo">Rural<span>Learning</span></a>
    <nav id="side-nav" style="display: contents;"></nav>
  </aside>

  <!-- Content -->
  <main class="main-content">
    
    <header class="profile-header">
      <div class="avatar-big" id="hero-init">?</div>
      <div class="header-info">
        <h1 id="hero-name">Loading...</h1>
        <p id="hero-meta">Fetching account details...</p>
      </div>
    </header>

    <div class="profile-grid">
      <!-- Edit Section -->
      <section class="card">
        <h3 style="margin-bottom: 20px;">Account Settings</h3>
        <form id="profile-form">
            <div class="input-group">
              <label>Full Name</label>
              <input type="text" id="p-name" required>
            </div>
            <div class="input-group">
              <label>Email Address</label>
              <input type="email" id="p-email" disabled>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="input-group">
                    <label id="role-label">Class / Subject</label>
                    <input type="text" id="p-role-info" disabled>
                </div>
                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="p-mobile">
                </div>
            </div>
            <button type="submit" class="btn-save" id="save-btn">Save Profile Changes</button>
        </form>
      </section>

      <!-- Sidebar Section -->
      <aside>
        <section class="card" style="margin-bottom: 24px;">
          <h3 style="margin-bottom: 15px;">Learning Achievements</h3>
          <div class="achievement-item">
            <div style="font-size: 1.5rem;">🌱</div>
            <div><b>New Explorer</b><p style="font-size:0.75rem; color:var(--muted);">Joined the Rural Learning community</p></div>
          </div>
        </section>

        <section class="card" style="border-color: #fee2e2;">
            <h3 style="margin-bottom: 10px; color: var(--red);">Security</h3>
            <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 15px;">Securely sign out of your account.</p>
            <button class="btn-save" style="background:var(--red);" onclick="clearSession()">Logout Account</button>
        </section>
      </aside>
    </div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Get user from localStorage (Automatically saved during login/registration)
        const user = getUser(); 
        if (!user) {
            window.location.replace('login.html');
            return;
        }

        // 2. Build Sidebar (Sync with other pages)
        const nav = document.getElementById('side-nav');
        if (user.role === 'teacher') {
            nav.innerHTML = `
                <a href="Dashboard-teacher.html" class="nav-link"><i>🏠</i> Studio Home</a>
                <a href="Tutorials.html" class="nav-link"><i>🎥</i> Video Studio</a>
                <a href="Assignments.html" class="nav-link"><i>📝</i> Manage Work</a>
                <a href="Quiz.html" class="nav-link"><i>⏱️</i> Quiz Creator</a>
                <a href="Materials.html" class="nav-link"><i>📄</i> Library Uploads</a>
                <div class="nav-section-label">Account Settings</div>
                <a href="student-profile.html" class="nav-link on"><i>👤</i> My Profile</a>
                <a href="#" onclick="clearSession()" class="nav-link sign-out"><i>🚪</i> Sign Out</a>
            `;
            document.getElementById('role-label').innerText = "Expert Subject";
            document.getElementById('p-role-info').value = user.expertSubject || "Faculty";
            document.getElementById('hero-meta').innerText = "Faculty Member • Expert Teacher";
        } else {
            nav.innerHTML = `
                <a href="Dashboard-student.html" class="nav-link"><i>🏠</i> Learning Path</a>
                <a href="Tutorials.html" class="nav-link"><i>🎥</i> Video Classes</a>
                <a href="Assignments-student.html" class="nav-link"><i>📝</i> My Assignments</a>
                <a href="Quiz.html" class="nav-link"><i>⏱️</i> Practice Quizzes</a>
                <a href="Materials.html" class="nav-link"><i>📄</i> Resource Library</a>
                <div class="nav-section-label">Account Settings</div>
                <a href="student-profile.html" class="nav-link on"><i>👤</i> My Profile</a>
                <a href="#" onclick="clearSession()" class="nav-link sign-out"><i>🚪</i> Sign Out</a>
            `;
            document.getElementById('role-label').innerText = "Current Class";
            document.getElementById('p-role-info').value = user.studentClass?.toUpperCase() || "N/A";
            document.getElementById('hero-meta').innerText = `Student • ${user.studentClass?.toUpperCase() || 'Enrollment Active'}`;
        }

        // 3. Populate Page with Registration Data
        document.getElementById('hero-name').innerText = user.name;
        document.getElementById('hero-init').innerText = user.name.charAt(0).toUpperCase();
        document.getElementById('p-name').value = user.name;
        document.getElementById('p-email').value = user.email;
        document.getElementById('p-mobile').value = user.mobile || "";

        document.body.style.opacity = '1';
    });

    // 4. Update Profile Logic
    document.getElementById('student-profile-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('save-btn');
        const updatedData = {
            name: document.getElementById('p-name').value,
            mobile: document.getElementById('p-mobile').value
        };

        btn.innerText = "⏳ Updating...";
        btn.disabled = true;

        try {
            // This calls AuthAPI from your api.js
            const res = await AuthAPI.updatestudent-profile(updatedData);
            if(res.success) {
                alert("✅ Profile updated successfully!");
                // Update local storage so the UI changes immediately
                const user = getUser();
                user.name = updatedData.name;
                user.mobile = updatedData.mobile;
                saveUser(user); 
                location.reload();
            } else {
                alert("❌ Update failed: " + res.message);
            }
        } catch (err) {
            console.error(err);
            alert("❌ Server Error");
        } finally {
            btn.innerText = "Save Profile Changes";
            btn.disabled = false;
        }
    };
  </script>
</body>
</html>
