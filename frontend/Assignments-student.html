<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Assignments — Rural Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<script src="api.js"></script>
<script src="main.js"></script>
<style>
    :root {
      --primary: #52b788;
      --primary-soft: rgba(82, 183, 136, 0.1);
      --bg: #081c15;
      --card: rgba(255, 255, 255, 0.04);
      --sidebar: #0b251d;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --border: rgba(82, 183, 136, 0.15);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      --accent: #f4a261;
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.15);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: var(--bg); 
      color: var(--text); 
      min-height: 100vh; 
      display: flex; 
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    /* background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(circle at 80% 20%, rgba(82, 183, 136, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 10% 80%, rgba(244, 162, 97, 0.03) 0%, transparent 40%);
      pointer-events: none;
    }

    .wrap { display: flex; width: 100%; min-height: 100vh; }

    /* --- SIDEBAR --- */
    .sidebar {
      width: 280px; 
      background: var(--sidebar); 
      border-right: 1px solid var(--border);
      padding: 40px 24px; 
      display: flex; 
      flex-direction: column;
      position: sticky; 
      top: 0; 
      height: 100vh; 
      flex-shrink: 0;
    }
    .logo { 
      font-family: 'Playfair Display'; 
      font-size: 1.5rem; 
      font-weight: 900; 
      text-decoration: none; 
      color: var(--text); 
      display: block; 
      margin-bottom: 48px; 
    }
    .logo span { color: var(--primary); }

    .nav-menu { list-style: none; flex-grow: 1; }
    .nav-link { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 14px 16px; 
      text-decoration: none; 
      color: var(--text-muted); 
      border-radius: 14px; 
      font-weight: 600; 
      transition: 0.3s; 
      margin-bottom: 5px; 
    }
    .nav-link:hover, .nav-link.active { 
      background: var(--primary-soft); 
      color: var(--primary); 
      box-shadow: 0 4px 20px rgba(82, 183, 136, 0.08);
    }

    .profile-footer {
      background: var(--card); 
      border: 1px solid var(--border);
      padding: 12px; 
      border-radius: 16px; 
      display: flex; 
      align-items: center; 
      gap: 12px;
      margin-top: auto;
    }
    .profile-avatar { 
      width: 36px; 
      height: 36px; 
      background: var(--primary); 
      color: #081c15; 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 800; 
      font-size: 0.9rem; 
    }

    /* --- MAIN CONTENT --- */
    .main { 
      flex: 1; 
      padding: 40px 60px; 
      max-width: 1000px; 
      margin: 0 auto; 
      width: 100%;
      animation: fadeInUp 0.8s ease;
    }
    .page-head { margin-bottom: 32px; }
    .page-head h1 { font-family: 'Playfair Display'; font-size: 2.2rem; }
    .page-head p { color: var(--text-muted); margin-top: 4px; font-size: 1.1rem; }
    
    /* ASSIGNMENT CARD */
    .a-card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 24px; 
      padding: 24px 32px; 
      margin-bottom: 20px; 
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .a-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
    .a-title { font-size: 1.15rem; font-weight: 700; color: var(--text); }
    .meta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
    .tag { 
      background: var(--primary-soft); 
      color: var(--primary); 
      padding: 4px 12px; 
      border-radius: 6px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      border: 1px solid rgba(82, 183, 136, 0.15);
    }
    
    .submit-panel { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
    .submit-panel.open { display: block; }
    .drop-zone { 
      border: 2px dashed var(--border); 
      border-radius: 16px; 
      padding: 32px; 
      text-align: center; 
      cursor: pointer; 
      background: rgba(255, 255, 255, 0.01); 
      transition: 0.3s;
    }
    .drop-zone:hover {
      border-color: var(--primary);
      background: rgba(82, 183, 136, 0.04);
    }
    
    .btn-submit { 
      background: var(--primary); 
      color: #081c15; 
      border: none; 
      padding: 12px 28px; 
      border-radius: 12px; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: 16px; 
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(82, 183, 136, 0.2);
    }
    .btn-submit:hover {
      background: #409a71;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(82, 183, 136, 0.3);
    }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-toggle { 
      background: rgba(255, 255, 255, 0.05); 
      color: var(--text); 
      border: 1px solid var(--border); 
      padding: 12px 24px; 
      border-radius: 12px; 
      font-weight: 700; 
      cursor: pointer; 
      font-size: .85rem; 
      transition: 0.3s;
    }
    .btn-toggle:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--primary);
    }
    
    .empty-state { 
      text-align: center; 
      padding: 60px; 
      color: var(--text-muted); 
      border: 2px dashed var(--border); 
      border-radius: 24px; 
      background: var(--card);
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

<div class="wrap" style="width: 100%; display: flex;">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="#" class="logo">Rural<span>Learning</span></a>
    <ul class="nav-menu" id="side-nav">
      <!-- Injected Dynamically Based on Role -->
    </ul>
    <div class="profile-footer">
        <div class="profile-avatar" id="footer-init">?</div>
        <div>
            <div id="footer-name" style="font-weight:700; font-size:0.85rem; color: var(--text);">Loading...</div>
            <div id="footer-class" style="font-size:0.7rem; color:var(--text-muted);">fetching profile</div>
        </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <h1>My Assignments</h1>
      <p>Submit your work before the deadline to earn learning points.</p>
    </div>
    <div id="a-container">
      <div class="empty-state"><h3>⏳ Connecting to server...</h3></div>
    </div>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const user = getUser();
    if (!user) {
        window.location.replace('Login.html');
        return;
    }

    // Setup profile UI
    document.getElementById('footer-name').innerText = user.name;
    document.getElementById('footer-class').innerText = "CLASS " + user.studentClass.toUpperCase();
    document.getElementById('footer-init').innerText = user.name.charAt(0).toUpperCase();

    // Setup Sidebar
    const nav = document.getElementById('side-nav');
    nav.innerHTML = `
        <a href="Dashboard-student.html" class="nav-link">🏠 Dashboard</a>
        <a href="Tutorials.html" class="nav-link">🎥 Video Lessons</a>
        <a href="Assignments-student.html" class="nav-link active">✏️ Assignments</a>
        <a href="Quiz.html" class="nav-link">⏱️ Quizzes</a>
        <a href="Materials.html" class="nav-link">📄 Study Library</a>
        <a href="Chat.html" class="nav-link">💬 Classroom Chat</a>
        <div style="margin: 40px 0 10px; font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Personal Analytics</div>
        <a href="student-profile.html" class="nav-link">👤 My Profile</a>
        <a href="Progress.html" class="nav-link">📊 My Reports</a>
        <a href="Scoreboard.html" class="nav-link">🏆 Honor Board</a>
        <a href="#" onclick="logout()" class="nav-link" style="color: #ef4444; margin-top: 40px;">🚪 Sign Out</a>
    `;

    await loadAssignments();
    document.body.style.opacity = '1';
});

async function loadAssignments() {
    const container = document.getElementById('a-container');
    try {
        const res = await ContentAPI.getAssignments();
        const assignments = Array.isArray(res) ? res : (res.assignments || []);

        if (assignments.length === 0) {
            container.innerHTML = `<div class="empty-state"><h3>📭 No assignments found.</h3><p style="margin-top:8px;">Check back later for new tasks.</p></div>`;
            return;
        }

        container.innerHTML = assignments.map(a => {
            const due = a.dueDate ? new Date(a.dueDate).toLocaleDateString() : 'No Date';
            return `
                <div class="a-card">
                    <div class="a-card-top">
                        <div style="flex:1;">
                            <div class="a-title">${a.title || 'Untitled Assignment'}</div>
                            <div class="meta-row">
                                <span class="tag">📚 ${a.subject || 'General'}</span>
                                <span class="tag" style="background:rgba(244, 162, 97, 0.05); color:var(--accent); border-color:rgba(244,162,97,0.15);">📅 Due: ${due}</span>
                            </div>
                            <div style="margin-top:14px; color:var(--text-muted); font-size:0.95rem; line-height:1.5;">${a.description || ''}</div>
                        </div>
                        <button class="btn-toggle" onclick="toggleSubmit(${a.id})">📤 Submit Work</button>
                    </div>

                    <div class="submit-panel" id="panel-${a.id}">
                        <div class="drop-zone" onclick="document.getElementById('file-${a.id}').click()">
                            <div style="font-size:1.8rem; margin-bottom:8px;">📁</div>
                            <div style="font-size:.95rem;"><strong>Click to select file</strong></div>
                            <div id="fname-${a.id}" style="color:var(--primary); font-weight:bold; margin-top:8px; display:none;"></div>
                            <input type="file" id="file-${a.id}" hidden onchange="onFileSelect(${a.id}, this)">
                        </div>
                        <button class="btn-submit" id="btn-submit-${a.id}" onclick="submitWork(${a.id})" disabled>
                            ✅ Upload and Submit
                        </button>
                    </div>
                </div>`;
        }).join('');
    } catch(e) {
        console.error("❌ API ERROR:", e);
        container.innerHTML = `<div class="empty-state"><h3>⚠️ Connection Error</h3><p style="margin-top:8px;">Make sure your backend server is running on port 5000.</p></div>`;
    }
}

function toggleSubmit(id) {
    document.getElementById('panel-' + id).classList.toggle('open');
}

function onFileSelect(id, input) {
    const file = input.files[0];
    if (file) {
        const nameEl = document.getElementById('fname-' + id);
        nameEl.innerText = '📎 ' + file.name;
        nameEl.style.display = 'block';
        document.getElementById('btn-submit-' + id).disabled = false;
    }
}

async function submitWork(assignmentId) {
    const fileInput = document.getElementById(`file-${assignmentId}`);
    const file = fileInput.files[0];
    const btn = document.getElementById(`btn-submit-${assignmentId}`);

    const formData = new FormData();
    formData.append('workFile', file); 

    btn.innerText = "⏳ Uploading...";
    btn.disabled = true;

    try {
        const res = await ContentAPI.submitWork(assignmentId, formData);
        if (res.success) {
            alert("✅ Submitted!");
            location.reload(); 
        } else {
            alert("❌ Error: " + res.message);
            btn.innerText = "Upload and Submit";
            btn.disabled = false;
        }
    } catch (error) {
        alert("❌ Server Error");
        btn.disabled = false;
    }
}

function logout() {
    sessionStorage.clear();
    window.location.replace('Login.html');
}
</script>
</body>
</html>
